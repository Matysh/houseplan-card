<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="928" viewBox="0 0 1560 928">
  <defs>
    <pattern id="floor-grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 H 0 V 80" fill="none" stroke="#dce2e6" stroke-width="1" opacity=".48"/>
    </pattern>
    <pattern id="bath-tile" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#dce3e6" stroke-width="1"/>
    </pattern>
    <style>
      text { font-family: Inter, 'Segoe UI', Arial, sans-serif; }
      .room-label { fill:#7b858f; font-size:18px; font-weight:500; text-anchor:middle; }
      .room-area { fill:#9aa3ac; font-size:12px; font-weight:400; text-anchor:middle; }
      .wall { fill:none; stroke:#75808b; stroke-linejoin:miter; stroke-linecap:butt; }
      .door { fill:none; stroke:#9aa4ad; stroke-width:1.8; }
      .furniture { fill:#e5e9ec; stroke:#c2cbd2; stroke-width:1.5; }
      .detail { fill:none; stroke:#c4cdd4; stroke-width:1.3; }
      .measurement { fill:#a2abb3; font-size:12px; text-anchor:middle; }
    </style>
  </defs>

