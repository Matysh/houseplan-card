<script>
(() => {
 const root=document.getElementById('hp-device-settings-v6');
 const dataset=JSON.parse(document.getElementById('hp-device-settings-v6-data').textContent);
 const cases=new Map(dataset.cases.map(c=>[c.id,c]));
 const picker=root.querySelector('#hp-review-case');
 const status=root.querySelector('#hp-review-status');
 const articles=[...root.querySelectorAll('[data-view]')];
 let current='radar', backstack=[], groups={};
 function draftLabel(f){return f.id==='room.custom-color'?'Цвет комнаты':(f.labelAfter||f.label);}
 const dirtyCases=new Set();
 let lastSentState='';
 function canonicalState(value){if(Array.isArray(value))return value.map(canonicalState);if(value&&typeof value==='object')return Object.fromEntries(Object.keys(value).sort().map(key=>[key,canonicalState(value[key])]));return value;}
 function stateKey(value){return JSON.stringify(canonicalState(value));}
 function currentSnapshot(){return {current,groups,backstack:backstack.slice(-8),local:serializeLocalState()};}
 function saveState(){const snapshot=structuredClone(currentSnapshot());lastSentState=stateKey(snapshot);if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{comparisonCase:current,caseName:active().name,section:groups[current]||active().initialAfterGroup},privateContent:{settingsDeviceV6:snapshot}}).catch(()=>{});}
 function restore(s){const x=s?.privateContent?.settingsDeviceV6;if(!x||!cases.has(x.current))return;const key=stateKey(x);if(key===lastSentState||key===stateKey(currentSnapshot()))return;current=x.current;groups=x.groups&&typeof x.groups==='object'?structuredClone(x.groups):{};backstack=Array.isArray(x.backstack)?x.backstack.filter(k=>cases.has(k)).slice(-8):[];restoreLocalState(x.local);render();}
 const initialValues=new Map(dataset.cases.map(c=>[c.id,new Map(c.fields.map(f=>[f.id,structuredClone(f.value)]))]));
 const savedCases=new Map(dataset.cases.map(c=>[c.id,new Map(c.fields.map(f=>[f.id,structuredClone(f.value)]))]));
 function serializeLocalState(){const changes={},saved={};dataset.cases.forEach(c=>{const a={},b={};c.fields.forEach(f=>{const initial=JSON.stringify(initialValues.get(c.id).get(f.id));if(JSON.stringify(f.value)!==initial)a[f.id]=f.value;const value=savedCases.get(c.id).get(f.id);if(JSON.stringify(value)!==initial)b[f.id]=value;});if(Object.keys(a).length)changes[c.id]=a;if(Object.keys(b).length)saved[c.id]=b;});return {changes,saved,dirty:[...dirtyCases]};}
 function restoreLocalState(x){if(!x)return;dirtyCases.clear();dataset.cases.forEach(c=>{c.fields.forEach(f=>{const initial=initialValues.get(c.id).get(f.id);f.value=structuredClone(Object.hasOwn(x.changes?.[c.id]||{},f.id)?x.changes[c.id][f.id]:initial);savedCases.get(c.id).set(f.id,structuredClone(Object.hasOwn(x.saved?.[c.id]||{},f.id)?x.saved[c.id][f.id]:initial));});});(x.dirty||[]).filter(id=>cases.has(id)).forEach(id=>dirtyCases.add(id));}
 function markSaved(c){savedCases.set(c.id,new Map(c.fields.map(f=>[f.id,structuredClone(f.value)])));dirtyCases.delete(c.id);}
 function discardLocal(c){c.fields.forEach(f=>{if(savedCases.get(c.id)?.has(f.id))f.value=structuredClone(savedCases.get(c.id).get(f.id));});dirtyCases.delete(c.id);}
 function updateDraftChrome(){const c=active();articles.forEach(a=>{if(!c.parentId){const save=a.querySelector('[data-footer] .primary');if(save)save.disabled=!dirtyCases.has(c.id);if(a.dataset.view==='after'){const note=a.querySelector('.footer-status');if(note)note.textContent=dirtyCases.has(c.id)?'Есть несохранённые изменения':'Все изменения сохранены';}}});}
 const helpPopup=el('div','hp-help-popup');helpPopup.id='hp-drafts-help';helpPopup.hidden=true;helpPopup.setAttribute('role','tooltip');root.append(helpPopup);let helpTrigger=null,helpPinned=false;
 function hideHelp(){helpTrigger?.removeAttribute('aria-describedby');helpTrigger=null;helpPinned=false;helpPopup.hidden=true;}
 function showHelp(button){if(helpTrigger!==button)hideHelp();helpTrigger=button;helpPopup.textContent=button.dataset.helpText;helpPopup.hidden=false;button.setAttribute('aria-describedby',helpPopup.id);const r=root.getBoundingClientRect(),b=button.getBoundingClientRect();helpPopup.style.width=Math.min(320,r.width-16)+'px';const p=helpPopup.getBoundingClientRect();helpPopup.style.left=Math.max(8,Math.min(b.left-r.left+b.width/2-p.width/2,r.width-p.width-8))+'px';helpPopup.style.top=(b.top-p.height-8>=Math.max(4,r.top)?b.top-r.top-p.height-8:b.bottom-r.top+8)+'px';}
 function bindHelp(button,text){button.dataset.helpText=text;button.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch')showHelp(button);});button.addEventListener('pointerleave',()=>{if(helpTrigger===button&&!helpPinned&&document.activeElement!==button)hideHelp();});button.addEventListener('focus',()=>showHelp(button));button.addEventListener('blur',hideHelp);button.addEventListener('click',()=>{if(helpTrigger===button&&helpPinned)hideHelp();else{showHelp(button);helpPinned=true;}});}
 function helpButton(text,label){const b=el('button','field-help-toggle cursor-interaction','?');b.type='button';b.setAttribute('aria-label','Подсказка: '+label);bindHelp(b,text);return b;}
 const colorPopup=el('div','hp-color-popup');colorPopup.id='hp-drafts-color';colorPopup.hidden=true;colorPopup.setAttribute('role','dialog');colorPopup.setAttribute('aria-modal','false');root.append(colorPopup);let colorSession=null;
 function hideColorPicker(restoreFocus=false){const trigger=colorSession?.trigger;if(trigger)trigger.setAttribute('aria-expanded','false');colorSession=null;colorPopup.hidden=true;if(restoreFocus&&trigger?.isConnected)trigger.focus();}
