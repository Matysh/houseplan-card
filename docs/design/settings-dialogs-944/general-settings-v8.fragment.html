<script>
(() => {
 const root=document.getElementById('hp-general-review-v8');
 const dataset=JSON.parse(document.getElementById('hp-general-v8-data').textContent);
 const cases=new Map(dataset.cases.map(c=>[c.id,c]));
 const picker=root.querySelector('#hp-review-case');
 const status=root.querySelector('#hp-review-status');
 const articles=[...root.querySelectorAll('[data-view]')];
 let current='general', backstack=[], groups={};
 let dirty=false,lastSentState='';const scanState={house:'saved',garage:'saved'};
 let savedValues=new Map(dataset.cases[0].fields.map(f=>[f.id,f.value]));
 function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=String(text);return e;}
 const colorPopup=el('div','hp-color-popup');colorPopup.id='hp-general-review-v8-color-picker';colorPopup.hidden=true;colorPopup.setAttribute('role','dialog');colorPopup.setAttribute('aria-modal','false');root.append(colorPopup);let colorSession=null;
 function hideColorPicker(restoreFocus=false){const trigger=colorSession?.trigger;if(trigger)trigger.setAttribute('aria-expanded','false');colorSession=null;colorPopup.hidden=true;if(restoreFocus&&trigger?.isConnected)trigger.focus();}
 function positionColorPicker(){if(!colorSession)return;const r=root.getBoundingClientRect(),b=colorSession.trigger.getBoundingClientRect();colorPopup.style.width=Math.min(300,r.width-16)+'px';const p=colorPopup.getBoundingClientRect();const x=Math.max(8,Math.min(b.left-r.left,r.width-p.width-8));const lower=b.bottom+7;const upper=b.top-p.height-7;const top=lower+p.height<=window.innerHeight-8?lower:upper>=8?upper:Math.max(8,Math.min(lower,window.innerHeight-p.height-8));colorPopup.style.left=x+'px';colorPopup.style.top=top-r.top+'px';}
 function refreshColorValues(f,a){root.querySelectorAll('[data-color-choice="'+f.id+'"]').forEach(button=>{const swatch=button.querySelector('.hp-color-swatch > span');swatch.style.background=f.value||'#607D8B';swatch.style.opacity=a?Number(a.value)/100:1;button.querySelector('.hp-color-code').textContent=f.value===null?'Цвет темы':f.value;const percent=button.querySelector('.hp-color-alpha');if(percent){percent.textContent=a.value+'%';percent.dataset.value=JSON.stringify(a.value);}button.closest('[data-field]').dataset.value=JSON.stringify(f.value);});const before=root.querySelector('[data-view="before"] [data-field="'+f.id+'"]');if(before){before.dataset.value=JSON.stringify(f.value);const input=before.querySelector('input[type="color"]');if(input)input.value=f.value||'#607D8B';const code=before.querySelector('code');if(code)code.textContent=f.value===null?'Цвет темы':f.value;}if(a){const beforeAlpha=root.querySelector('[data-view="before"] [data-field="'+a.id+'"]');if(beforeAlpha){beforeAlpha.dataset.value=JSON.stringify(a.value);const input=beforeAlpha.querySelector('input');if(input)input.value=a.value;}}articles.forEach(article=>{const save=article.querySelector('[data-footer] .primary');if(save)save.disabled=!dirty;});root.querySelector('[data-view="after"] .footer-status').textContent=dirty?'Есть несохранённые изменения':'Все изменения сохранены';}
 function openColorPicker(f,a,trigger){hideHelp();hideColorPicker();colorSession={f,a,trigger};trigger.setAttribute('aria-expanded','true');colorPopup.replaceChildren();colorPopup.hidden=false;const title=el('h4','',f.labelAfter||f.label);title.id=colorPopup.id+'-title';colorPopup.setAttribute('aria-labelledby',title.id);colorPopup.append(title);
  const rgbLabel=el('label');rgbLabel.append(el('span','','Цвет'));const rgb=el('input');rgb.type='color';rgb.value=f.value||'#607D8B';rgb.setAttribute('aria-label','Выбрать цвет');rgbLabel.append(rgb);colorPopup.append(rgbLabel);
  const hexLabel=el('label');hexLabel.append(el('span','','HEX'));const hex=el('input','hp-input');hex.type='text';hex.maxLength=7;hex.value=f.value||'#607D8B';hex.setAttribute('aria-label','HEX цвета');hexLabel.append(hex);colorPopup.append(hexLabel);
  const updateColor=value=>{f.value=value.toUpperCase();dirty=true;rgb.value=f.value;hex.value=f.value;hex.removeAttribute('aria-invalid');refreshColorValues(f,a);saveState();};rgb.addEventListener('input',()=>updateColor(rgb.value));hex.addEventListener('input',()=>{if(/^#[0-9a-f]{6}$/i.test(hex.value))updateColor(hex.value);else hex.setAttribute('aria-invalid','true');});hex.addEventListener('blur',()=>{hex.value=f.value||'#607D8B';hex.removeAttribute('aria-invalid');});
  if(a){const label=el('label');label.append(el('span','','Прозрачность'));const controls=el('div','hp-alpha-controls');const range=el('input');range.type='range';range.min=0;range.max=100;range.step=1;range.value=a.value;range.setAttribute('aria-label','Прозрачность цвета');const number=el('input','hp-input');number.type='number';number.min=0;number.max=100;number.step=1;number.value=a.value;number.setAttribute('aria-label','Прозрачность, проценты');const updateAlpha=value=>{a.value=Math.round(Math.max(0,Math.min(100,value)));dirty=true;range.value=a.value;number.value=a.value;refreshColorValues(f,a);saveState();};range.addEventListener('input',()=>updateAlpha(Number(range.value)));number.addEventListener('input',()=>{if(number.value!=='')updateAlpha(Number(number.value));});number.addEventListener('blur',()=>{number.value=a.value;});controls.append(range,number,el('span','','%'));label.append(controls);colorPopup.append(label,el('div','hp-alpha-note',a.id==='g-glow-light-opacity'?'Интенсивность эффекта: 0% — без свечения, 100% — максимальная.':'0% — невидимый цвет, 100% — непрозрачный.'));}
  if(a?.id==='g-glow-light-opacity')colorPopup.querySelector('.hp-alpha-controls').parentElement.firstElementChild.textContent='Интенсивность свечения';
  const ok=el('button','hp-color-ok','ОК');ok.type='button';ok.addEventListener('click',()=>hideColorPicker(true));colorPopup.append(ok);positionColorPicker();hex.focus();
 }
 function colorField(f,a,c,view){if(view!=='after')return field(f,c,view);const node=field(f,c,view),old=node.querySelector('.hp-color-row');const button=el('button','hp-color-choice');button.type='button';button.dataset.colorChoice=f.id;button.setAttribute('aria-label',(a?'Цвет и прозрачность: ':'Цвет: ')+(f.labelAfter||f.label));button.setAttribute('aria-haspopup','dialog');button.setAttribute('aria-expanded','false');button.setAttribute('aria-controls',colorPopup.id);const swatch=el('span','hp-color-swatch'),fill=el('span');fill.style.background=f.value||'#607D8B';fill.style.opacity=a?Number(a.value)/100:1;swatch.append(fill);button.append(swatch,el('span','hp-color-code',f.value===null?'Цвет темы':f.value));if(a){const alpha=el('span','hp-color-alpha',a.value+'%');alpha.dataset.field=a.id;alpha.dataset.value=JSON.stringify(a.value);button.append(alpha);}button.addEventListener('click',()=>{if(colorSession?.trigger===button)hideColorPicker();else openColorPicker(f,a,button);});old.replaceWith(button);return node;}
 root.addEventListener('pointerdown',e=>{if(colorSession&&!colorPopup.contains(e.target)&&!colorSession.trigger.contains(e.target))hideColorPicker();});root.addEventListener('keydown',e=>{if(e.key==='Escape'&&colorSession){e.stopPropagation();hideColorPicker(true);}});root.addEventListener('focusin',e=>{if(colorSession&&!colorPopup.contains(e.target)&&!colorSession.trigger.contains(e.target))hideColorPicker();});root.addEventListener('scroll',()=>hideColorPicker(),true);window.addEventListener('resize',()=>hideColorPicker());
 const helpPopup=el('div','hp-help-popup');helpPopup.id='hp-general-review-v8-help';helpPopup.setAttribute('role','tooltip');helpPopup.hidden=true;root.append(helpPopup);let helpTrigger=null,helpPinned=false;
 function hideHelp(){helpTrigger?.removeAttribute('aria-describedby');helpTrigger=null;helpPinned=false;helpPopup.hidden=true;}
 function showHelp(button){if(helpTrigger!==button)hideHelp();helpTrigger=button;helpPopup.textContent=button.dataset.helpText;helpPopup.hidden=false;button.setAttribute('aria-describedby',helpPopup.id);const r=root.getBoundingClientRect(),b=button.getBoundingClientRect();helpPopup.style.width=Math.min(320,r.width-16)+'px';const p=helpPopup.getBoundingClientRect();const x=Math.max(8,Math.min(b.left-r.left+b.width/2-p.width/2,r.width-p.width-8));const y=b.top-p.height-8>=Math.max(4,r.top)?b.top-r.top-p.height-8:b.bottom-r.top+8;helpPopup.style.left=x+'px';helpPopup.style.top=y+'px';}
 function bindHelp(button,text){button.dataset.helpText=text;button.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch')showHelp(button);});button.addEventListener('pointerleave',()=>{if(helpTrigger===button&&!helpPinned&&document.activeElement!==button)hideHelp();});button.addEventListener('focus',()=>showHelp(button));button.addEventListener('blur',hideHelp);button.addEventListener('click',()=>{if(helpTrigger===button&&helpPinned)hideHelp();else{showHelp(button);helpPinned=true;}});}
 root.addEventListener('keydown',e=>{if(e.key==='Escape')hideHelp();});root.addEventListener('pointerdown',e=>{if(helpTrigger&&!helpTrigger.contains(e.target))hideHelp();});root.addEventListener('scroll',hideHelp,true);window.addEventListener('resize',hideHelp);
 function icon(name){const e=el('i');e.dataset.lucide=name;e.setAttribute('aria-hidden','true');return e;}
 function shown(f,c){if(!f.showIf)return true;const value=c.fields.find(x=>x.id===f.showIf.field)?.value;return f.showIf.oneOf.includes(value);}
 function cleanNote(text){return (text||'').replace(/[^.!?]*фикстур[^.!?]*[.!?]?/gi,'').trim();}
 function active(){return cases.get(current)||dataset.cases[0];}
 function topCase(c){let n=c;while(n.parentId&&cases.has(n.parentId))n=cases.get(n.parentId);return n;}
 function saveState(){const snapshot={groups,dirty,values:Object.fromEntries(active().fields.map(f=>[f.id,f.value])),savedValues:Object.fromEntries(savedValues),scanState,history:active().optimizationHistory};lastSentState=JSON.stringify(snapshot);if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{comparisonCase:'general-v8',section:groups[current]||active().initialAfterGroup,north:active().fields.find(f=>f.id==='g-north').value,windowRayOrigin:active().fields.find(f=>f.id==='g-sun-origin').value},privateContent:{generalSettingsV8:snapshot}}).catch(()=>{});}
 function restore(s){const x=s?.privateContent?.generalSettingsV8;if(!x||JSON.stringify(x)===lastSentState)return;groups=x.groups&&typeof x.groups==='object'?x.groups:{};dirty=Boolean(x.dirty);if(x.values)active().fields.forEach(f=>{if(Object.hasOwn(x.values,f.id))f.value=x.values[f.id];});if(x.savedValues)savedValues=new Map(Object.entries(x.savedValues));if(x.scanState)Object.assign(scanState,x.scanState);if(typeof x.history==='boolean')active().optimizationHistory=x.history;render();}
 function go(id,group){if(!cases.has(id))return;backstack.push(current);current=id;if(group)groups[id]=group;render();saveState();}
 function back(){const c=active();current=backstack.pop()||c.parentId||topCase(c).id;render();saveState();}
 function relatedTarget(f,c){const s=f.source||'';if(/^https?:/.test(s))return null;
  if(c.id!=='general'&&/общ/i.test(s)){const group=/glow|north|sun|ray|moon|свеч|радиус/i.test(f.id+' '+f.label)?'g-after-light':/bg|wall|фон|стен/i.test(f.id+' '+f.label)?'g-after-appearance':'g-after-view';return ['general',group];}
  if(c.id!=='space'&&/пространств/i.test(s)){const group=/scale|font|шрифт/i.test(f.id+' '+f.label)?'s-after-cards':/north|bg|ray|север|фон|луч/i.test(f.id+' '+f.label)?'s-after-environment':'s-after-rooms';return ['space',group];}return null;}
 function scene(visual,text){const box=el('div','hp-scene');box.setAttribute('role','img');box.setAttribute('aria-label',text);const ns='http://www.w3.org/2000/svg';const svg=document.createElementNS(ns,'svg');const vb=visual.viewBox||[0,0,1000,800];svg.setAttribute('viewBox',vb.join(' '));svg.setAttribute('aria-hidden','true');box.append(svg);
  function shape(tag,attrs,cls){const n=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,String(v)));n.setAttribute('class',cls);svg.append(n);return n;}
  function label(x,y,t,cls){const n=el('span',cls,t);n.style.left=(x/vb[2]*100)+'%';n.style.top=(y/vb[3]*100)+'%';box.append(n);}
  (visual.rooms||[]).forEach(r=>{shape('polygon',{points:r.points.map(p=>p.join(',')).join(' ')},'scene-room');const xs=r.points.map(p=>p[0]),ys=r.points.map(p=>p[1]);label((Math.min(...xs)+Math.max(...xs))/2,(Math.min(...ys)+Math.max(...ys))/2,r.name,'scene-label');});
  if(visual.overlay){shape('polygon',{points:visual.overlay.corners.map(p=>p.join(',')).join(' ')},'scene-overlay');visual.overlay.corners.forEach(p=>shape('rect',{x:p[0]-10,y:p[1]-10,width:20,height:20},'scene-handle'));}
  if(visual.robot)label(visual.robot.x,visual.robot.y,'Р','scene-point');if(visual.dock)label(visual.dock.x,visual.dock.y,'База','scene-label');
  if(visual.mount)label(visual.mount.x,visual.mount.y,'R','scene-point');(visual.targets||[]).forEach(p=>label(p.x,p.y,p.id,'scene-point'));(visual.references||[]).forEach(p=>label(p.x,p.y,p.id,'scene-point scene-ref'));
  box.append(el('span','scene-caption',visual.type==='radar'?'R — установка · ● цели · ○ точки проверки':'Наложение карты · 90° · отражение'));
  return box;
 }
 function action(f,c,view){
  if(f.id.startsWith('g-z2m-update-')){const which=f.id.endsWith('house')?'house':'garage';scanState[which]='pending';renderKeepingScroll();status.textContent='Макет: начат фоновый запрос карты. Реальная сеть Zigbee не опрашивается.';return;}
  if(f.id==='g-optimize-undo'&&c.optimizationHistory){c.optimizationHistory=false;renderKeepingScroll();status.textContent='Макет: последняя оптимизация отменена. Сохранённой истории для повторной отмены нет.';return;}
  if(f.id==='g-optimize'){c.optimizationHistory=true;renderKeepingScroll();status.textContent='Макет: после просмотра отчёта и подтверждения оптимизации станет доступна её отмена.';return;}
  if(f.id==='g-north-reset'){setField(c.fields.find(x=>x.id==='g-north'),null);return;}
  if(f.id==='g-wall-reset'){c.fields.find(x=>x.id==='g-wall-color').value='#FFFFFF';setField(c.fields.find(x=>x.id==='g-wall-opacity'),100);return;}
  if(f.id==='g-bg-reset'){setField(c.fields.find(x=>x.id==='g-bg-color'),null);return;}
  status.textContent='Макет: «'+(view==='after'?(f.labelAfter||f.label):f.label)+'». В рабочем интерфейсе откроется соответствующий диалог.';
 }
 function renderKeepingScroll(){const scrolls=articles.map(a=>a.querySelector('[data-content]').scrollTop);render();articles.forEach((a,i)=>a.querySelector('[data-content]').scrollTop=scrolls[i]);}
 function setField(f,value){f.value=value;dirty=true;renderKeepingScroll();saveState();}
 function setSelect(f,value){
  f.value=value;dirty=true;const c=active();

  const cancel=el('button','quiet','Отмена');cancel.addEventListener('click',()=>{c.fields.forEach(f=>{if(savedValues.has(f.id))f.value=savedValues.get(f.id);});dirty=false;renderKeepingScroll();article.hidden=true;root.querySelector('[data-closed="'+view+'"]').hidden=false;saveState();});foot.append(cancel);
  const saveLabel=view==='after'?(['vacuum','radar'].includes(c.id)?'Сохранить устройство':c.footer?.afterSave??'Сохранить'):(c.footer?.beforeSave??'Сохранить');
  if(saveLabel!==''){const save=el('button','primary',saveLabel);save.disabled=!dirty;save.addEventListener('click',()=>{dirty=false;savedValues=new Map(c.fields.map(f=>[f.id,f.value]));renderKeepingScroll();saveState();status.textContent='Изменения сохранены только в макете.';});foot.append(save);}
 }
 function groupFields(card,g,c,view){const list=g.fields.map(id=>c.fields.find(f=>f.id===id)).filter(Boolean);let consumed=new Set();let diagnostics;
  if(view==='after'&&g.id==='g-after-data'){
   [['g-backup-import','g-backup-export'],['g-optimize','g-optimize-undo']].forEach(ids=>{const row=el('div','hp-actions-row');ids.forEach(id=>row.append(field(c.fields.find(f=>f.id===id),c,view)));card.append(row);});
   const line=el('div','hp-converter');line.append(el('div','','Если у вас есть план Sweet Home 3D (.sh3d) или Easy Floorplan (YAML / JSON), то вы можете конвертировать его в формат для House Plan:'));const link=el('a','','Конвертировать для House Plan ↗');link.href='https://houseplan.tech/convert/';link.target='_blank';link.rel='noreferrer';line.append(link,el('div','field-note','Результат — JSON, который можно загрузить кнопкой «Импорт».'));card.append(line);return;
  }
  if(c.id==='vacuum'&&view==='after'&&g.id==='vacuum'){const ids=['vac_integration','vac_position','vac_rooms','vac_integration_path','vac_path_source','vac_path_quality','vac_path_counts','vac_path_received','vac_path_final','vac_map_id'];diagnostics=el('details','hp-diagnostics');diagnostics.append(el('summary','','Диагностика карты и маршрута'));ids.forEach(id=>{const f=list.find(x=>x.id===id);if(f){diagnostics.append(field(f,c,view));consumed.add(id);}});}
  if(c.id==='general'&&list.some(f=>f.id==='g-light-on-color')){[['Освещение',['light-on','light-off','light-none']],['Температура',['temp-cold','temp-ok','temp-hot']],['Сигнал Zigbee',['lqi-low','lqi-high']]].forEach(([title,keys])=>{card.append(el('h4','',title));const grid=el('div','hp-palette');keys.forEach(key=>{const tile=el('div','hp-palette-tile');const color=list.find(x=>x.id==='g-'+key+'-color'),alpha=list.find(x=>x.id==='g-'+key+'-opacity');if(view==='after'){tile.append(colorField(color,alpha,c,view));consumed.add(color.id);consumed.add(alpha.id);}else{[color,alpha].forEach(f=>{if(!f)return;const node=field(f,c,view);if(f===alpha){const label=node.querySelector('.field-label');const help=label.querySelector('button');label.replaceChildren(document.createTextNode('Прозрачность'));if(help)label.append(help);}tile.append(node);consumed.add(f.id);});}grid.append(tile);});card.append(grid);});}
  let metrics;
  list.forEach((f,index)=>{if(consumed.has(f.id))return;
   if(view==='after'&&f.id==='g-bg-color'){const row=el('div','hp-bg-inline');row.hidden=!shown(f,c);row.append(colorField(f,null,c,view),field(c.fields.find(x=>x.id==='g-bg-reset'),c,view));card.append(row);consumed.add('g-bg-reset');return;}
   if(view==='after'&&/g-z2m-(house|garage)-status/.test(f.id)){const which=f.id.includes('house')?'house':'garage';const actionId='g-z2m-update-'+which;const row=el('div','hp-topic-row');row.hidden=!shown(f,c);const left=el('div','hp-topic-copy');const actionNode=field(c.fields.find(x=>x.id===actionId),c,view);left.append(field(f,c,view));const note=actionNode.querySelector('.field-note');row.append(left,actionNode);if(note){note.classList.add('hp-topic-note');row.append(note);}card.append(row);consumed.add(actionId);return;}
   (g.subheadings||[]).filter(s=>s.beforeField===f.id).forEach(s=>card.append(el('h4','',diagnostics&&f.id==='vac_source'?'Источник и состояние':s.title)));
   if(c.id==='space'&&['s-label-temp','s-label-hum','s-label-lqi','s-label-light'].includes(f.id)){if(!metrics){metrics=el('div','hp-metrics');card.append(metrics);}metrics.append(field(f,c,view));return;}
   if(c.id==='general'&&f.id==='g-backup-export')card.append(el('h4','','Резервная копия и перенос'));
   if(c.id==='general'&&f.id==='g-optimize')card.append(el('h4','','Обслуживание планов'));
   if(view==='after'&&f.id==='room.name-scale')card.append(el('h4','','Размеры шрифтов'));
   const next=list[index+1];if(f.type==='color'&&next&&/opacity/.test(next.id)&&shown(f,c)&&shown(next,c)){if(view==='after')card.append(colorField(f,next,c,view));else{const pair=el('div','hp-pair');pair.append(field(f,c,view),field(next,c,view));card.append(pair);}consumed.add(next.id);}else card.append(field(f,c,view));
  });
  if(diagnostics)card.append(diagnostics);
 }
 function render(){
  hideColorPicker();
  hideHelp();
  const c=active();picker.value=topCase(c).id;status.textContent='';
  root.querySelector('#hp-review-summary').textContent=c.summary;
  root.querySelector('#hp-review-parity').textContent='Общие поля используют один набор данных. В «После» по запросу убраны затемнение комнат и кнопки сброса севера и цвета стен, добавлены превью фона и ссылка на конвертер. «Сейчас» — реконструкция текущего интерфейса по коду. Для демонстрации исключений у «2 этажа» есть своя настройка Zigbee-сигнала.';
  const sourceList=root.querySelector('#hp-review-sources');sourceList.replaceChildren();(c.sources||[]).slice(0,5).forEach(url=>{const li=el('li');const a=el('a','',decodeURIComponent(url.split('/').slice(-1)[0]));a.href=url;a.target='_blank';a.rel='noreferrer';li.append(a);sourceList.append(li);});
  articles.forEach(article=>{
   const view=article.dataset.view;article.hidden=false;root.querySelector('[data-closed="'+view+'"]').hidden=true;
   article.querySelector('[data-title]').textContent=view==='after'?c.afterTitle:c.beforeTitle;
   const ctx=article.querySelector('[data-context]');const kind={device:'Устройство',workflow:'Настройка',room:'Комната',space:'Пространство',general:'Общие настройки'}[c.kind]||c.kind||'';ctx.textContent=c.parentId?kind+' · '+(cases.get(c.parentId)?.name||''):['led','climate','vacuum','radar'].includes(c.id)?'1 этаж · жилой / Гостиная':c.id==='room'?'Комната · 1 этаж · жилой':kind;
   if(view==='before'){const scope=article.querySelector('[data-scope]');scope.textContent=['general'].includes(c.id)?'':c.parentId?'Houseplan':'1 этаж · жилой';scope.hidden=c.id==='general';}
   const body=article.querySelector('[data-content]');body.replaceChildren();body.scrollTop=0;
   const order=view==='after'?c.afterGroups:c.beforeGroups;
   const selected=groups[c.id]||c.initialAfterGroup||order[0]?.id;
   if(view==='after'){
    groups[c.id]=order.some(g=>g.id===selected)?selected:order[0]?.id;
    const nav=article.querySelector('[data-nav]'), tabs=article.querySelector('[data-tabs]'), mobile=article.querySelector('[data-mobile-nav]');nav.replaceChildren();tabs.replaceChildren();mobile.replaceChildren();
    const tabbed=order.length>1&&order.length<=3;article.classList.toggle('is-tabs',tabbed);article.classList.toggle('is-single',order.length===1);tabs.hidden=!tabbed;
    order.forEach(g=>{[nav,tabs].forEach(parent=>{const b=el('button','',g.title);b.type='button';b.dataset.groupButton=g.id;b.setAttribute('aria-pressed',String(g.id===groups[c.id]));b.addEventListener('click',()=>selectGroup(g.id));parent.append(b);});const opt=el('option','',g.title);opt.value=g.id;mobile.append(opt);});mobile.value=groups[c.id];mobile.onchange=()=>selectGroup(mobile.value);
   }
   order.forEach(g=>{
    if(view==='before'&&/футер/.test(g.title))return;
    const card=el('section','hp-group');card.dataset.section=g.id;
    if(g.title)card.append(el('h3','',g.title));
    if(view==='after'&&g.id==='g-after-fills')card.append(el('div','hp-palette-caption','Общая палитра для всех пространств'));
    if(view==='after'){card.hidden=g.id!==groups[c.id];}
    groupFields(card,g,c,view);if(view==='before'&&g.parentGroup){const parent=body.querySelector('[data-section="'+g.parentGroup+'"]');if(parent){card.style.padding='0';card.style.marginTop='20px';parent.append(card);}else body.append(card);}else body.append(card);
   });footer(article,c,view);
  });
  designRender();
  if(globalThis.lucide)lucide.createIcons({attrs:{width:20,height:20}});
 }
 const main=dataset.cases.filter(c=>!c.parentId);main.forEach(c=>{const o=el('option','',c.name);o.value=c.id;picker.append(o);});
 picker.addEventListener('change',()=>{current=picker.value;backstack=[];render();saveState();});
 articles.forEach(article=>{article.querySelector('[data-close]').addEventListener('click',()=>{article.hidden=true;root.querySelector('[data-closed="'+article.dataset.view+'"]').hidden=false;});});
 root.querySelectorAll('[data-reopen]').forEach(b=>b.addEventListener('click',()=>{root.querySelector('[data-view="'+b.dataset.reopen+'"]').hidden=false;b.parentElement.hidden=true;}));
 const after=root.querySelector('[data-view="after"]');const design={gap:18,origins:true};
 if(!cases.has(current))current=main[0].id;
 render();restore(window.openai?.widgetState);
 window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)restore(event.detail.globals.widgetState);});
 function designRender(){after.style.setProperty('--hp-row-gap',design.gap+'px');after.querySelectorAll('.hp-source,.hp-effective').forEach(e=>{e.hidden=!design.origins;});}
 if(globalThis.Tweak){const conditions={history:true,savedMaps:true};const tweak=new Tweak({container:after,onChange:()=>{active().optimizationHistory=conditions.history;scanState.house=scanState.garage=conditions.savedMaps?'saved':'empty';renderKeepingScroll();saveState();}});tweak.addToggle(conditions,'history',{label:'Есть история оптимизации'});tweak.addToggle(conditions,'savedMaps',{label:'Есть сохранённые карты Zigbee2MQTT'});}
})();
