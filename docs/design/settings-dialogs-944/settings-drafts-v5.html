&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;

  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );

  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**

   * @param {string} property

    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;

      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };

    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }

      modelContent: null,
      privateContent: null,
      ...parsedState,
    };

    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,

    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }

      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),

    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);

        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });

  syncTheme();
})();

&lt;script type=&quot;application/json&quot; id=&quot;hp-settings-drafts-v5-data&quot;&gt;{&quot;baseline&quot;:&quot;104a63f1e218eede610dd621a62346ceb3eab2e6&quot;,&quot;status&quot;:&quot;draft&quot;,&quot;cases&quot;:[{&quot;id&quot;:&quot;space&quot;,&quot;name&quot;:&quot;Пространство · 1 этаж&quot;,&quot;kind&quot;:&quot;Настройки одного пространства&quot;,&quot;context&quot;:&quot;То же синтетическое домовладение. Редактируется «1 этаж · жилой»: существующая картинка floor01.svg, 5 см/клетку, заполненный план. Общие: статичный фон #17212B, север 32°, лучи вкл, LQI выкл, радиус Glow 3,5 м. До — реконструкция по коду, не screenshot.&quot;,&quot;beforeTitle&quot;:&quot;Пространство&quot;,&quot;afterTitle&quot;:&quot;Пространство · 1 этаж · жилой&quot;,&quot;summary&quot;:&quot;Четыре раздела вместо шести. Операции с пространством перенесены вниз. Компас и масштаб карточек работают. Исходные значения общих полей совпадают; в «После» добавлен будущий показатель CO₂ (#920), убраны согласованные переключатели и кнопки сброса. Старый диалог сохранён для сравнения.&quot;,&quot;initialAfterGroup&quot;:&quot;s-after-plan&quot;,&quot;sources&quot;:[&quot;https://github.com/Matysh/houseplan-card/blob/104a63f1e218eede610dd621a62346ceb3eab2e6/src/editors/space-form.ts#L153&quot;,&quot;https://github.com/Matysh/houseplan-card/blob/104a63f1e218eede610dd621a62346ceb3eab2e6/src/editors/space-form.ts#L298&quot;,&quot;https://github.com/Matysh/houseplan-card/blob/104a63f1e218eede610dd621a62346ceb3eab2e6/src/editors/space-form.ts#L487&quot;,&quot;https://github.com/Matysh/houseplan-card/blob/104a63f1e218eede610dd621a62346ceb3eab2e6/src/houseplan-editor-runtime.ts#L7817&quot;,&quot;https://github.com/Matysh/houseplan-card/blob/104a63f1e218eede610dd621a62346ceb3eab2e6/src/houseplan-editor-runtime.ts#L8014&quot;,&quot;https://github.com/Matysh/houseplan-card/blob/104a63f1e218eede610dd621a62346ceb3eab2e6/src/houseplan-editor-runtime.ts#L8041&quot;,&quot;https://github.com/Matysh/houseplan-card/blob/104a63f1e218eede610dd621a62346ceb3eab2e6/src/signal-visibility.ts#L26&quot;,&quot;https://github.com/Matysh/houseplan-card/blob/104a63f1e218eede610dd621a62346ceb3eab2e6/src/i18n/ru.json&quot;,&quot;https://github.com/Matysh/houseplan-card/blob/104a63f1e218eede610dd621a62346ceb3eab2e6/src/i18n/settings/ru.json&quot;],&quot;footer&quot;:{&quot;beforeSave&quot;:&quot;Сохранить&quot;,&quot;afterSave&quot;:&quot;Сохранить&quot;},&quot;fields&quot;:[{&quot;boundary&quot;:&quot;draft&quot;,&quot;id&quot;:&quot;s-name&quot;,&quot;label&quot;:&quot;Название пространства&quot;,&quot;type&quot;:&quot;text&quot;,&quot;value&quot;:&quot;1 этаж · жилой&quot;},{&quot;boundary&quot;:&quot;draft&quot;,&quot;id&quot;:&quot;s-cell&quot;,&quot;label&quot;:&quot;Масштаб (размер клетки сетки)&quot;,&quot;type&quot;:&quot;number&quot;,&quot;value&quot;:5,&quot;unit&quot;:&quot;см на клетку&quot;,&quot;step&quot;:0.1,&quot;help&quot;:&quot;Связывает сетку с реальными размерами: от значения зависят длины и площади, толщина стен, размеры проёмов и радиус свечения. Изменение после разметки меняет расчётные размеры всего пространства, но не двигает его точки на плане.&quot;,&quot;helpAfter&quot;:&quot;Масштаб геометрии, а не размер интерфейса. После изменения появляется предупреждение о пересчёте размеров при сохранении.&quot;},{&quot;boundary&quot;:&quot;draft&quot;,&quot;id&quot;:&quot;s-plan-source&quot;,&quot;label&quot;:&quot;Подложка&quot;,&quot;labelAfter&quot;:&quot;Источник плана&quot;,&quot;type&quot;:&quot;select&quot;,&quot;value&quot;:&quot;file&quot;,&quot;options&quot;:[{&quot;value&quot;:&quot;draw&quot;,&quot;label&quot;:&quot;Нарисовать вручную&quot;},{&quot;value&quot;:&quot;file&quot;,&quot;label&quot;:&quot;Использовать изображение плана&quot;}],&quot;help&quot;:&quot;Изображение под планом, поверх которого рисуют. Комнаты и устройства остаются редактируемыми. При переходе на рисование вручную загруженное изображение сохраняется и доступно снова.&quot;},{&quot;boundary&quot;:&quot;read&quot;,&quot;id&quot;:&quot;s-plan-image&quot;,&quot;label&quot;:&quot;&quot;,&quot;labelAfter&quot;:&quot;Изображение плана&quot;,&quot;type&quot;:&quot;file&quot;,&quot;value&quot;:&quot;floor01.svg&quot;,&quot;showIf&quot;:{&quot;field&quot;:&quot;s-plan-source&quot;,&quot;oneOf&quot;:[&quot;file&quot;]},&quot;readOnly&quot;:true,&quot;help&quot;:&quot;Текущая форма показывает миниатюру существующей картинки, без подписи имени. floor01.svg — метаданные синтетической фикстуры; не новое поле Before.&quot;,&quot;afterOnlyNote&quot;:&quot;Показывать имя floor01.svg рядом с миниатюрой — предлагаемое улучшение.&quot;},{&quot;boundary&quot;:&quot;draft&quot;,&quot;id&quot;:&quot;s-plan-replace&quot;,&quot;label&quot;:&quot;Заменить…&quot;,&quot;type&quot;:&quot;action&quot;,&quot;value&quot;:&quot;Заменить…&quot;,&quot;showIf&quot;:{&quot;field&quot;:&quot;s-plan-source&quot;,&quot;oneOf&quot;:[&quot;file&quot;]},&quot;actionStyle&quot;:&quot;secondary&quot;,&quot;help&quot;:&quot;Выбор SVG/PNG/JPG/WebP меняет черновик; загрузка и принятие конфигурации происходят при «Сохранить». Для пространства без картинки подпись «Загрузить…».&quot;},{&quot;boundary&quot;:&quot;read&quot;,&quot;id&quot;:&quot;s-plan-saved&quot;,&quot;label&quot;:&quot;Уже загруженные&quot;,&quot;type&quot;:&quot;action&quot;,&quot;value&quot;:&quot;Уже загруженные&quot;,&quot;showIf&quot;:{&quot;field&quot;:&quot;s-plan-source&quot;,&quot;oneOf&quot;:[&quot;file&quot;]},&quot;actionStyle&quot;:&quot;secondary&quot;,&quot;target&quot;:&quot;space-plan-library&quot;,&quot;help&quot;:&quot;Планы, сохранённые на сервере, включая отцеплённые ранее. В текущей форме список раскрывается внутри; дочерний case показывает его целиком.&quot;},{&quot;boundary&quot;:&quot;read&quot;,&quot;id&quot;:&quot;s-plan-kept&quot;,&quot;label&quot;:&quot;&quot;,&quot;type&quot;:&quot;info&quot;,&quot;value&quot;:&quot;Загруженное изображение сохранено. Переключитесь обратно, чтобы снова использовать его.&quot;,&quot;showIf&quot;:{&quot;field&quot;:&quot;s-plan-source&quot;,&quot;oneOf&quot;:[&quot;draw&quot;]},&quot;readOnly&quot;:true,&quot;help&quot;:&quot;После сохранения Draw ссылка и трансформация картинки снимаются; файл остаётся на сервере. Комнаты и другие объекты сохраняются.&quot;},{&quot;boundary&quot;:&quot;draft&quot;,&quot;id&quot;:&quot;s-show-borders&quot;,&quot;label&quot;:&quot;Всегда отображать границы комнат&quot;,&quot;type&quot;:&quot;toggle&quot;,&quot;value&quot;:true,&quot;help&quot;:&quot;Показывать узорную обводку стен.&quot;,&quot;helpAfter&quot;:&quot;Если границы комнат уже нарисованы на загруженном изображении плана, выключите эту опцию, чтобы не обводить их повторно. Если рисуете план вручную, оставьте её включённой. Выключение скрывает обводку и линии стен нулевой толщины; сами стены и расчёт света сохраняются.&quot;},{&quot;boundary&quot;:&quot;draft&quot;,&quot;id&quot;:&quot;s-zero-walls&quot;,&quot;label&quot;:&quot;Стены нулевой толщины&quot;,&quot;type&quot;:&quot;select&quot;,&quot;value&quot;:&quot;dashed&quot;,&quot;options&quot;:[{&quot;value&quot;:&quot;dashed&quot;,&quot;label&quot;:&quot;Пунктирные&quot;},{&quot;value&quot;:&quot;solid&quot;,&quot;label&quot;:&quot;Сплошные&quot;}],&quot;help&quot;:&quot;Пунктирные стены нулевой толщины пропускают Glow и солнечные лучи, сплошные блокируют их как барьер нулевой площади. Выбор меняет все такие стены пространства, даже когда их линии скрыты в просмотре.&quot;,&quot;afterOnlyNote&quot;:&quot;Это также правило прохождения света, не только стиль линии.&quot;,&quot;optionsAfter&quot;:[{&quot;value&quot;:&quot;dashed&quot;,&quot;label&quot;:&quot;Пунктирные (пропускают свет)&quot;},{&quot;value&quot;:&quot;solid&quot;,&quot;label&quot;:&quot;Сплошные (не пропускают свет)&quot;}]},{&quot;boundary&quot;:&quot;draft&quot;,&quot;id&quot;:&quot;s-room-color&quot;,&quot;label&quot;:&quot;Цвет границ и названий&quot;,&quot;type&quot;:&quot;color&quot;,&quot;value&quot;:&quot;#66788A&quot;,&quot;source&quot;:&quot;Своё значение пространства&quot;,&quot;helpAfter&quot;:&quot;Отдельно от цвета пола и заливки тел толстых стен.&quot;},{&quot;boundary&quot;:&quot;draft&quot;,&quot;id&quot;:&quot;s-room-opacity&quot;,&quot;label&quot;:&quot;Прозрачность&quot;,&quot;labelAfter&quot;:&quot;Прозрачность границ и названий&quot;,&quot;type&quot;:&quot;number&quot;,&quot;value&quot;:70,&quot;unit&quot;:&quot;%&quot;,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:1},{&quot;boundary&quot;:&quot;draft&quot;,&quot;id&quot;:&quot;s-room-color-reset&quot;,&quot;label&quot;:&quot;Сброс&quot;,&quot;labelAfter&quot;:&quot;Сбросить цвет границ и названий&quot;,&quot;type&quot;:&quot;action&quot;,&quot;value&quot;:&quot;Сброс&quot;,&quot;actionStyle&quot;:&quot;secondary&quot;,&quot;help&quot;:&quot;Черновой сброс цвета #55606C и прозрачности 55%; применяется при сохранении.&quot;},{&quot;boundary&quot;:&quot;draft&quot;,&quot;id&quot;:&quot;s-fill-mode&quot;,&quot;label&quot;:&quot;Заливка комнат&quot;,&quot;type&quot;:&quot;select&quot;,&quot;value&quot;:&quot;temp&quot;,&quot;options&quot;:[{&quot;value&quot;:&quot;custom&quot;,&quot;label&quot;:&quot;Свой цвет&quot;},{&quot;value&quot;:&quot;lqi&quot;,&quot;label&quot;:&quot;Zigbee&quot;},{&quot;value&quot;:&quot;light&quot;,&quot;label&quot;:&quot;Свет&quot;},{&quot;value&quot;:&quot;temp&quot;,&quot;label&quot;:&quot;Температура&quot;}],&quot;help&quot;:&quot;«Свой цвет» задаёт оформление, а «Свет», «Температура» и «LQI» используют текущие данные Home Assistant; Glow включается отдельно.&quot;,&quot;effective&quot;:&quot;Температура; комнаты без своего режима следуют пространству&quot;,&quot;optionsAfter&quot;:[{&quot;value&quot;:&quot;custom&quot;,&quot;label&quot;:&quot;Свой цвет&quot;},{&quot;value&quot;:&quot;lqi&quot;,&quot;label&quot;:&quot;По уровню сигнала Zigbee&quot;},{&quot;value&quot;:&quot;light&quot;,&quot;label&quot;:&quot;Вкл/выкл свет&quot;},{&quot;value&quot;:&quot;temp&quot;,&quot;label&quot;:&quot;По температуре&quot;}],&quot;helpAfter&quot;:&quot;Выберите, что определяет заливку: собственный цвет, средний сигнал Zigbee, включённый свет или температура комнаты. Комната может переопределить этот выбор.&quot;},{&quot;boundary&quot;:&quot;draft&quot;,&quot;id&quot;:&quot;s-custom-color&quot;,&quot;label&quot;:&quot;Цвет заливки&quot;,&quot;type&quot;:&quot;color&quot;,&quot;value&quot;:&quot;#D6B98C&quot;,&quot;showIf&quot;:{&quot;field&quot;:&quot;s-fill-mode&quot;,&quot;oneOf&quot;:[&quot;custom&quot;]},&quot;help&quot;:&quot;Сохранённый собственный цвет пространства. В исходной фикстуре не действует, потому что выбран режим «Температура».&quot;},{&quot;boundary&quot;:&quot;draft&quot;,&quot;id&quot;:&quot;s-custom-opacity&quot;,&quot;label&quot;:&quot;Прозрачность&quot;,&quot;labelAfter&quot;:&quot;Прозрачность заливки&quot;,&quot;type&quot;:&quot;number&quot;,&quot;value&quot;:18,&quot;unit&quot;:&quot;%&quot;,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:1,&quot;showIf&quot;:{&quot;field&quot;:&quot;s-fill-mode&quot;,&quot;oneOf&quot;:[&quot;custom&quot;]}},{&quot;boundary&quot;:&quot;draft&quot;,&quot;id&quot;:&quot;s-custom-reset&quot;,&quot;label&quot;:&quot;Сброс&quot;,&quot;labelAfter&quot;:&quot;Сбросить собственный цвет заливки&quot;,&quot;type&quot;:&quot;action&quot;,&quot;value&quot;:&quot;Сброс&quot;,&quot;actionStyle&quot;:&quot;secondary&quot;,&quot;showIf&quot;:{&quot;field&quot;:&quot;s-fill-mode&quot;,&quot;oneOf&quot;:[&quot;custom&quot;]},&quot;help&quot;:&quot;Убирает собственный цвет из черновика; цвет по умолчанию #607D8B, 18%.&quot;},{&quot;boundary&quot;:&quot;draft&quot;,&quot;id&quot;:&quot;s-temp-min&quot;,&quot;label&quot;:&quot;Минимум&quot;,&quot;labelAfter&quot;:&quot;Комфортная температура · минимум&quot;,&quot;type&quot;:&quot;number&quot;,&quot;value&quot;:20,&quot;unit&quot;:&quot;°C&quot;,&quot;step&quot;:0.5,&quot;showIf&quot;:{&quot;field&quot;:&quot;s-fill-mode&quot;,&quot;oneOf&quot;:[&quot;temp&quot;]},&quot;help&quot;:&quot;Комфортный диапазон&quot;,&quot;source&quot;:&quot;Своё значение пространства; комната может переопределить каждую границу&quot;},{&quot;boundary&quot;:&quot;draft&quot;,&quot;id&quot;:&quot;s-temp-max&quot;,&quot;label&quot;:&quot;Максимум&quot;,&quot;labelAfter&quot;:&quot;Комфортная температура · максимум&quot;,&quot;type&quot;:&quot;number&quot;,&quot;value&quot;:24,&quot;unit&quot;:&quot;°C&quot;,&quot;step&quot;:0.5,&quot;showIf&quot;:{&quot;field&quot;:&quot;s-fill-mode&quot;,&quot;oneOf&quot;:[&quot;temp&quot;]},&quot;help&quot;:&quot;Ниже минимума — холодно. В диапазоне — комфорт. Выше максимума — жарко. Без показаний температуры свечение источников света всё равно даёт базовую заливку.&quot;,&quot;effective&quot;:&quot;20–24 °C; цвета состояний — из общих настроек&quot;},{&quot;boundary&quot;:&quot;read&quot;,&quot;id&quot;:&quot;s-fill-lqi-hint&quot;,&quot;label&quot;:&quot;&quot;,&quot;type&quot;:&quot;info&quot;,&quot;value&quot;:&quot;По среднему LQI комнаты: слабый — 40 и ниже, сильный — 180 и выше. Цвета и прозрачность — из общей палитры.&quot;,&quot;readOnly&quot;:true,&quot;showIf&quot;:{&quot;field&quot;:&quot;s-fill-mode&quot;,&quot;oneOf&quot;:[&quot;lqi&quot;]}},{&quot;boundary&quot;:&quot;read&quot;,&quot;id&quot;:&quot;s-fill-light-hint&quot;,&quot;label&quot;:&quot;&quot;,&quot;type&quot;:&quot;info&quot;,&quot;value&quot;:&quot;Отдельные цвета для «горит хотя бы одна», «все выключены» и «источников нет». Цвета и прозрачность — из общей палитры.&quot;,&quot;readOnly&quot;:true,&quot;showIf&quot;:{&quot;field&quot;:&quot;s-fill-mode&quot;,&quot;oneOf&quot;:[&quot;light&quot;]}},{&quot;boundary&quot;:&quot;draft&quot;,&quot;id&quot;:&quot;s-layer-decor&quot;,&quot;label&quot;:&quot;Декоративный слой&quot;,&quot;type&quot;:&quot;toggle&quot;,&quot;value&quot;:true,&quot;help&quot;:&quot;Скрытие меняет только то, что видно на плане. Декоративные элементы остаются в редакторе подложки.&quot;},{&quot;boundary дтверждение&quot;,&quot;type&quot;:&quot;toggle&quot;,&quot;value&quot;:true,&quot;boundary&quot;:&quot;draft&quot;,&quot;showIf&quot;:{&quot;field&quot;:&quot;led.tap&quot;,&quot;oneOf&quot;:[&quot;toggle&quot;,&quot;run&quot;]},&quot;help&quot;:&quot;Спрашивать перед действием маркера и переключением любой строки в его карточке.&quot;},{&quot;id&quot;:&quot;led.controls&quot;,&quot;label&quot;:&quot;Управляет другими источниками света&quot;,&quot;type&quot;:&quot;info&quot;,&quot;value&quot;:&quot;Потолочная лампа · light.living_ceiling&quot;,&quot;boundary&quot;:&quot;draft&quot;,&quot;help&quot;:&quot;При действии «Переключить состояние» перечисленные источники переключаются вместе с этим маркером. Их световые пятна остаются у собственных маркеров, а эта связь сама по себе не делает управляющий маркер источником света.&quot;,&quot;labelAfter&quot;:&quot;Связанные источники света&quot;,&quot;helpAfter&quot;:&quot;Вместе с явно выбранным собственным каналом light.living_accent переключается light.living_ceiling. Роль собственного источника света задаётся отдельно.&quot;,&quot;readOnly&quot;:true},{&quot;id&quot;:&quot;led.remove-ceiling&quot;,&quot;label&quot;:&quot;Удалить&quot;,&quot;type&quot;:&quot;action&quot;,&quot;value&quot;:&quot;&quot;,&quot;boundary&quot;:&quot;draft&quot;,&quot;actionStyle&quot;:&quot;secondary&quot;,&quot;help&quot;:&quot;Крестик чипа «Потолочная лампа»; удаляет только связь.&quot;,&quot;labelAfter&quot;:&quot;Убрать связь: Потолочная лампа&quot;},{&quot;id&quot;:&quot;led.controls-search&quot;,&quot;label&quot;:&quot;&quot;,&quot;type&quot;:&quot;text&quot;,&quot;value&quot;:&quot;&quot;,&quot;placeholder&quot;:&quot;Поиск ламп и выключателей…&quot;,&quot;boundary&quot;:&quot;draft&quot;},{&quot;id&quot;:&quot;led.light-role&quot;,&quot;label&quot;:&quot;Является источником света&quot;,&quot;type&quot;:&quot;select&quot;,&quot;value&quot;:&quot;always&quot;,&quot;boundary&quot;:&quot;draft&quot;,&quot;options&quot;:[{&quot;value&quot;:&quot;auto&quot;,&quot;label&quot;:&quot;Авто&quot;},{&quot;value&quot;:&quot;always&quot;,&quot;label&quot;:&quot;Всегда&quot;},{&quot;value&quot;:&quot;never&quot;,&quot;label&quot;:&quot;Никогда&quot;}],&quot;help&quot;:&quot;«Авто» использует фактическую роль привязанного устройства, «Всегда» принудительно создаёт собственный источник, а «Никогда» исключает его; связанные лампы выше остаются независимыми.&quot;},{&quot;id&quot;:&quot;led.light-entity&quot;,&quot;label&quot;:&quot;Ведущая сущность света&quot;,&quot;type&quot;:&quot;select&quot;,&quot;value&quot;:&quot;light.living_cornice&quot;,&quot;boundary&quot;:&quot;draft&quot;,&quot;options&quot;:[{&quot;value&quot;:&quot;&quot;,&quot;label&quot;:&quot;Автоматически (light.living_cornice)&quot;},{&quot;value&quot;:&quot;light.living_cornice&quot;,&quot;label&quot;:&quot;Карниз · light.living_cornice&quot;},{&quot;value&quot;:&quot;light.living_accent&quot;,&quot;label&quot;:&quot;Акцент · light.living_accent&quot;}],&quot;showIf&quot;:{&quot;field&quot;:&quot;led.light-role&quot;,&quot;oneOf&quot;:[&quot;always&quot;]},&quot;help&quot;:&quot;Для составного устройства выберите сущность, состояние, цвет и яркость которой представляют этот источник на плане. Автоматический вариант сохраняет совместимость со старыми планами.&quot;,&quot;source&quot;:&quot;Явный выбор для состояния, цвета и яркости света&quot;},{&quot;id&quot;:&quot;led.glow-mode&quot;,&quot;label&quot;:&quot;Цвет и яркость свечения&quot;,&quot;type&quot;:&quot;select&quot;,&quot;value&quot;:&quot;fixed&quot;,&quot;boundary&quot;:&quot;draft&quot;,&quot;options&quot;:[{&quot;value&quot;:&quot;auto&quot;,&quot;label&quot;:&quot;Из источника&quot;},{&quot;value&quot;:&quot;color&quot;,&quot;label&quot;:&quot;Задать цвет&quot;},{&quot;value&quot;:&quot;fixed&quot;,&quot;label&quot;:&quot;Цвет и яркость&quot;}],&quot;help&quot;:&quot;Используйте данные источника, задайте только цвет или зафиксируйте цвет и яркость. Минимум — 1%; чтобы отключить ис
