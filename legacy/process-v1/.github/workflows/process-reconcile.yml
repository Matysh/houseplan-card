# Generated by scripts/service-workflows.mjs (#1040); mirrored to main.
# main only delivers; authenticated work runs on dev. Failures are not hidden.
name: "Сверка очереди ревью"
run-name: "${{ github.ref == 'refs/heads/dev' && format('dev · {0}', github.workflow) || format('relay · {0}', github.workflow) }}"

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      delivery:
        description: "Internal immutable origin locator; leave empty for an ordinary dev dispatch"
        type: string
        required: false
        default: ""
      apply:
        description: "Recover lost requests and publish diagnostics"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  event:
    permissions:
      contents: write
      actions: write
    uses: Matysh/houseplan-card/.github/workflows/_service-event.yml@dev # #1040: trusted delivery code from dev
    with:
      workflow: process-reconcile.yml
      parameters: ${{ toJSON(inputs) }}
    secrets: inherit
  dev:
    needs: event
    if: needs.event.outputs.accepted == 'true'
    permissions:
      actions: read
      contents: read
      issues: read
    uses: Matysh/houseplan-card/.github/workflows/_process-reconcile.yml@dev # #1040: reviewed execution body from dev
    with:
      source_event: ${{ needs.event.outputs.event }}
      source_event_name: ${{ needs.event.outputs.event_name }}
      apply: ${{ fromJSON(needs.event.outputs.parameters).apply }}
    secrets: inherit
