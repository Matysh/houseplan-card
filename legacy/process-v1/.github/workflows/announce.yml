name: Анонс релиза
# Telegram notifications for t.me/ha_houseplan (owner request, 2026-08-07).
# Stable releases are announced; prereleases are deliberately silent.
# workflow_dispatch exists purely as a connectivity test button and therefore
# remains allowed to send a test message.
# #538: НЕТ триггера `release: published`. Три воркфлоу висели на одном событии
# и бежали параллельно, а анонсу нечего было проверять — он выигрывал гонку
# всегда. 12.09 v1.75.0 объявили в канале в ту же минуту, когда гейт ассетов
# отказал: релиз остался без `houseplan-card.js`, E2E не выполнялся вовсе, а
# подписчики получили сообщение. Анонс вызывается только после того, как работа
# сделана: `release.yml` зовёт его после выкладки ассетов,
# `publish-prerelease.yml` — после публикации беты.
on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      reusable:
        required: true
        type: boolean
      tag:
        required: true
        type: string
      release_name:
        required: true
        type: string
      url:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
      ref:
        required: true
        type: string
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: true
      TELEGRAM_CHAT_ID:
        required: true
permissions:
  contents: read
jobs:
  telegram:
    name: Оповещение в Telegram (только стабильные)
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_call' && inputs.prerelease == false) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the transport and authored release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Send to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLED: ${{ inputs.reusable }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_NAME: ${{ inputs.release_name }}
          INPUT_URL: ${{ inputs.url }}
          INPUT_PRE: ${{ inputs.prerelease }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$INPUT_PRE" = "true" ]; then
            echo "Prerelease Telegram announcement is disabled"
            exit 0
          fi
          node scripts/telegram-release.mjs "$RUNNER_TEMP/telegram-request.json"
          curl -sS --fail-with-body -X POST \
            "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/telegram-request.json"
