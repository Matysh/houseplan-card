# Generated by scripts/service-workflows.mjs (#1040); mirrored to main.
# main only delivers; authenticated work runs on dev. Failures are not hidden.
name: "Бета: пакетное ревью ship"
run-name: "${{ github.ref == 'refs/heads/dev' && format('dev · {0}', github.workflow) || format('relay · {0}', github.workflow) }}"

on:
  workflow_dispatch:
    inputs:
      delivery:
        description: "Internal immutable origin locator; leave empty for an ordinary dev dispatch"
        type: string
        required: false
        default: ""
      tag:
        description: "Beta tag or nightly"
        type: string
        required: false
        default: ""
      candidate:
        description: "Exact candidate SHA; empty means dev"
        type: string
        required: false
        default: ""
      force:
        description: "Review even when already covered"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  event:
    permissions:
      contents: write
      actions: write
    uses: Matysh/houseplan-card/.github/workflows/_service-event.yml@dev # #1040: trusted delivery code from dev
    with:
      workflow: ship-review.yml
      parameters: ${{ toJSON(inputs) }}
    secrets: inherit
  dev:
    needs: event
    if: needs.event.outputs.accepted == 'true'
    permissions:
      contents: read
      issues: read
    concurrency:
      group: ${{ format('ship-review-{0}', fromJSON(needs.event.outputs.parameters).tag) }}
      cancel-in-progress: false
    uses: Matysh/houseplan-card/.github/workflows/_ship-review.yml@dev # #1040: reviewed execution body from dev
    with:
      source_event: ${{ needs.event.outputs.event }}
      source_event_name: ${{ needs.event.outputs.event_name }}
      tag: ${{ fromJSON(needs.event.outputs.parameters).tag }}
      candidate: ${{ fromJSON(needs.event.outputs.parameters).candidate }}
      force: ${{ fromJSON(needs.event.outputs.parameters).force }}
    secrets: inherit
