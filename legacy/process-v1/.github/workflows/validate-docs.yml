# Generated by node scripts/ci-profiles.mjs --write (#980).
# The shared display name preserves the existing main workflow_run trigger.
name: Проверка (CI)
run-name: 'CI docs · ${{ github.ref_name }}'

on:
  push:
    branches:
      - '**'
      - '!review-material/**'
      - '!ci-proofs'
    paths:
      - 'docs/**'
      - '*.md'
  pull_request:
    paths:
      - 'docs/**'
      - '*.md'

concurrency:
  group: validate-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: "Предполёт: документация, провенанс, процесс"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # `actions: read` — чтение списка прогонов Validate (#388), `issues: read` —
    # проверка 8 процессного гейта, `issues: write` — одно issue о расхождении
    # зеркала workflow на push в dev (#700). Права перечислены явно, потому что
    # job обращается к API сверх содержимого репозитория.
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      # `blob:none` при полной истории (#345): этой job нужны сообщения
      # коммитов, трейлеры и ИМЕНА изменённых файлов, а не содержимое старых
      # ревизий. Полный клон стоит 215 МБ против 26 МБ, и 32% этого веса —
      # скриншоты документации, переснятые 196 раз.
      #
      # Коммиты и деревья скачиваются целиком, поэтому диапазоны и `merge-base`
      # работают как раньше. Единственная догрузка по требованию здесь —
      # `git show origin/main:.github/workflows/<тонкий файл>`: по блобу на файл.
      # `fetch-tags: true` (#703): теги релиза — граница проверенного материала
      # для базы диапазона, а checkout по умолчанию качает с `--no-tags`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, filter: 'blob:none', fetch-tags: true }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22 }

      # Свежесть скриншотов на обычном пуше — предупреждение, на кандидате беты
      # (трейлер `Release:`), по кнопке и на PR — ошибка (#479). Остальные
      # проверки документации красят всегда. Режим считает тот же скрипт, что и
      # выход `heavy` job `changes`, чтобы два места не разошлись.
      - name: "Документация: гайды, ченджлоги, скриншот-индекс"
        id: docs
        continue-on-error: true
        env:
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          FULL_INPUT: ${{ inputs.full }}
          # #697: на ветке задачи `Release:` строгий режим не включает.
          REF_NAME: ${{ github.ref_name }}
        run: |
          # #700: на ветке задачи упавший чужой сайт — предупреждение, а не
          # красный preflight; push в dev, кандидат и релиз судят ссылки строго.
          external=--external
          case "$REF" in refs/heads/issue/*) external=--external=warn ;; esac
          # #586: CLI отдаёт ОДИН ответ. Прежде здесь сравнивался со строкой
          # `heavy=true` весь вывод `--heavy`, а он двухстрочный: в `$(…)`
          # строки схлопываются через пробел, сравнение не совпадало никогда,
          # и строгий режим не включился ни на одном кандидате.
          mode=$(node scripts/classify-changes.mjs --screenshots-mode)
          echo "скриншоты документации: режим $mode"
          node scripts/check-docs.mjs "$external" --screenshots=$mode

      # #635: `docs/reviews/INDEX.md` — снимок каталога ревью; расхождение с
      # каталогом — невидимые через индекс документы (r2 #635 H1). Гейт стоит
      # только на push в dev: там свежесть держит конвейер — пересборка при
      # публикации документа и после каждого своего ребейза (приведение к dev,
      # слияние кандидата). На issue-ветках не судится: их ребейзит и
      # публикует в них конвейер из ветки по умолчанию, и доехавший туда
      # документ раунда индекс ветки знать не обязан — красить автора за
      # коммит конвейера нельзя; расхождение излечивает слияние.
      - name: "Индекс ревью совпадает с каталогом docs/reviews"
        id: reviews_index
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        continue-on-error: true
        run: node scripts/reviews-index.mjs --dir=docs/reviews --check

      # #623: для событий `issues`, `schedule` и `workflow_run` GitHub берёт
      # workflow из ветки по умолчанию (`main`). Там лежат тонкие вызывающие
      # файлы — триггеры, run-name, права, concurrency, — а тело каждого
      # (`_<имя>.yml`) они вызывают по ссылке `@dev`. Правка конвейера — один
      # коммит в `dev`; тела здесь не сверяются: их копия в `main` не исполняется
      # ни одним событием. Тонкий файл сверяется: правка триггера или потолка
      # прав, не доехавшая до `main`, действовала бы только в dev-копии.
      #
      # #716: `ship-review.yml` и `beta-derived.yml` — только `workflow_dispatch`,
      # он исполняет файл с выбранной ветки, но запуск GitHub даёт лишь workflow,
      # чей файл есть в `main`. Шагам беты он нужен до промоушена, поэтому они
      # устроены так же и сверяются здесь же: правка входа или потолка прав,
      # не доехавшая до `main`, не действовала бы в запуске с `main`, а именно
      # его кнопка выбирает по умолчанию.
      #
      # `performance.yml` не входит: по расписанию он судит `main` собственным
      # телом из `main`, расхождение с `dev` до промоушена законно. Список ниже
      # держит равным множеству тонких файлов
      # test/default-branch-workflows.test.mjs.
      - name: "Процесс: тонкие вызывающие workflow идентичны в main и dev"
        id: workflow_sync
        continue-on-error: true
        run: |
          git fetch --quiet origin main dev
          status=0
          for file in process.yml mutation-gate.yml process-resume.yml nightly.yml process-reconcile.yml process-metrics.yml ship-review.yml beta-derived.yml; do
            if diff <(git show "origin/main:.github/workflows/$file") \
                    <(git show "origin/dev:.github/workflows/$file"); then
              echo "$file: main и dev идентичны"
            else
              echo "РАСХОЖДЕНИЕ: $file в main и dev различаются."
              echo "Тонкий вызывающий файл исполняется из ветки по умолчанию,"
              echo "поэтому правку триггеров или прав нужно зеркалить в main (#623)."
              status=1
            fi
          done
          exit $status

      # #700: расхождение зеркала на dev — одно открытое issue владельцу, как у
      # ночного мутационного гейта (#472): чинит его тот, кто зеркалит в main, а
      # не автор задачи, чья ветка ни при чём. Сбой API — предупреждение: шаг
      # сообщает, а не судит.
      - name: "Расхождение зеркала на dev — issue владельцу"
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && steps.workflow_sync.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker="[workflow-sync]"
          # Список не прочитан — нового issue нет: иначе сбой сети или
          # рейт-лимит плодил бы дубликат к уже открытому (r1 #700).
          if ! existing=$(gh issue list --repo "$REPO" --state open --search "\"$marker\" in:title" \
            --json number,title --jq '[.[] | select(.title | startswith("[workflow-sync]"))][0].number // empty'); then
            echo "::warning::открытые issue не прочитаны — новое не заводится, чтобы не завести дубликат"
            exit 0
          fi
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "Расхождение повторилось: $RUN_URL" \
              || echo "::warning::комментарий в #$existing не оставлен"
            exit 0
          fi
          cat > /tmp/workflow-sync.md <<EOF
          Тонкие вызывающие workflow в \`main\` и \`dev\` различаются. Прогон: $RUN_URL

          Тонкий файл исполняется из ветки по умолчанию, поэтому правку триггеров, входов или прав нужно зеркалить в \`main\` (PROCESS.md §10.4, #623). На ветках задач это предупреждение (#700), на push в \`dev\` — красный preflight, пока зеркало не выровнено.
          EOF
          gh issue create --repo "$REPO" --title "$marker тонкие workflow в main и dev различаются" \
            --label infra --label process --body-file /tmp/workflow-sync.md \
            || echo "::warning::issue о расхождении зеркала не заведено"

      # Оба гейта ниже судят САМ диапазон коммитов, а не объём проверок, и до
      # #388 брали его от головы предыдущего пуша. Прогон предыдущего пуша
      # штатно отменяется следующим (concurrency), и тогда его коммиты не судит
      # никто: свой прогон отменён, а следующий пуш сравнивает уже с ними.
      #
      # База — последний предок с УСПЕШНО завершённым Validate. Фолбэк остаётся
      # прежним `before`: расширять диапазон здесь нельзя, иначе гейт, который
      # сам красит прогон, лишает следующий пуш зелёного предка и запирает dev
      # в красноте навсегда.
      #
      # #703: то же на `main`. Stable-промоушен — пуш в `main` SHA, уже
      # судимого на `dev`; с `event.before` (прошлый stable) провенанс и
      # процессный гейт судили бы всю бета-линию заново. Прогоны читаются с
      # обеих интеграционных веток, сам HEAD засчитывает только успешный.
      - name: "База диапазона: последний доказанно зелёный предок"
        id: range
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          FALLBACK: ${{ github.event.before }}
        run: |
          # `status=completed`, а не `success`: гейтам диапазона нужен факт
          # «коммит судили», а не «вердикт был оправдательный». Упавший прогон
          # коммит судил; отменённый — нет, его отсеивает judgedShas (#388).
          for branch in dev main; do
            gh api -X GET "repos/$REPO/actions/runs" \
              -f branch="$branch" -f status=completed -F per_page=100 \
              > "/tmp/validate-runs-$branch.json" || echo '{}' > "/tmp/validate-runs-$branch.json"
          done
          node scripts/classify-base.mjs --head="$HEAD_SHA" --mode=range \
            --fallback="$FALLBACK" \
            --runs=/tmp/validate-runs-dev.json --runs=/tmp/validate-runs-main.json
      - name: "Провенанс коммитов: трейлеры и эталоны"
        id: provenance
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ steps.range.outputs.base || github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          DEVELOPMENT_BRANCH: dev
        run: |
          git fetch -q origin "refs/heads/$DEVELOPMENT_BRANCH:refs/remotes/origin/$DEVELOPMENT_BRANCH"
          node scripts/validate-commit-provenance.mjs --check-hook-mode --github-range

      # Догоняющая проверка процесса (PROCESS.md §10.3). Хуки ловят нарушение на
      # машине автора, но их можно обойти `--no-verify`, а коммиты идут прямо в
      # dev без PR — GitHub на своей стороне не блокирует ничего. Это последнее
      # место, где нарушение правила №1 ловится машиной. Откат — удалить шаг,
      # скрипт остаётся рабочим.
      - name: "Процессный гейт: диапазон, трейлеры, статусы issue"
        id: process_gate
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ steps.range.outputs.base || github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          DEVELOPMENT_BRANCH: dev
          TARGET_REF: ${{ github.ref }}
          # Публичный репозиторий: штатного токена хватает на чтение issue.
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin "refs/heads/$DEVELOPMENT_BRANCH:refs/remotes/origin/$DEVELOPMENT_BRANCH"
          node scripts/process-gate.mjs --github-range --issues

      # Вердикт обязан быть громким и перечислять всё упавшее сразу: иначе
      # слияние job стоило бы автору лишнего круга «починил одно — узнал о
      # втором».
      # #556: перемещаемая ссылка в `uses:` — доверие чужому владельцу тега
      # здесь и сейчас, а не коду, который читали. Проверка стоит в preflight:
      # она стоит миллисекунды и ловит правку, которая иначе доехала бы до
      # привилегированной стадии.
      - name: "Сторонние Actions закреплены полным SHA"
        id: action_pins
        continue-on-error: true
        run: node scripts/action-pins.mjs

      - name: Вердикт предполётных проверок
        env:
          DOCS: ${{ steps.docs.outcome }}
          WORKFLOW_SYNC: ${{ steps.workflow_sync.outcome }}
          PROVENANCE: ${{ steps.provenance.outcome }}
          PROCESS_GATE: ${{ steps.process_gate.outcome }}
          ACTION_PINS: ${{ steps.action_pins.outcome }}
          REVIEWS_INDEX: ${{ steps.reviews_index.outcome }}
          REF: ${{ github.ref }}
        run: |
          fail=0
          check() {
            if [ "$2" = "success" ]; then
              echo "ok   $1"
            else
              echo "FAIL $1 ($2)"
              echo "- **$1**: $2" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
          }
          # #700: причина, к которой ветка задачи отношения не имеет, — в сводку
          # предупреждением; на dev, кандидате и релизе она красит как прежде.
          advise() {
            if [ "$2" = "success" ]; then
              echo "ok   $1"
            else
              echo "::warning::$1 ($2) — на ветке задачи предупреждение (#700)"
              echo "- $1: $2 — предупреждение, чинит релиз-менеджер (#700)" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          task_branch=false
          case "$REF" in refs/heads/issue/*) task_branch=true ;; esac
          echo "### Предполётные проверки" >> "$GITHUB_STEP_SUMMARY"
          check "документация" "$DOCS"
          if [ "$task_branch" = "true" ]; then
            advise "тонкие вызывающие workflow в main и dev" "$WORKFLOW_SYNC"
          else
            check "тонкие вызывающие workflow в main и dev" "$WORKFLOW_SYNC"
          fi
          check "провенанс коммитов" "$PROVENANCE"
          check "процессный гейт" "$PROCESS_GATE"
          check "пины сторонних Actions" "$ACTION_PINS"
          # skipped — шаг не судил (не push в dev), это не отказ
          [ "$REVIEWS_INDEX" = "skipped" ] || check "индекс ревью совпадает с каталогом" "$REVIEWS_INDEX"
          exit $fail

  # #1044: обычная задача и интеграционный push выбирают семейства по диффу.
  # Полная регрессия запрашивается явно кандидатом, ночью или full=true;
  # release proof проверяет этот объём отдельно от зелёного статуса workflow.
      - name: Зафиксировать progress proof
        if: always()
        env:
          CI_WORKFLOW: validate-docs.yml
          CI_RESULT: ${{ job.status }}
        run: node scripts/ci-profile-proof.mjs
      - name: Опубликовать proof точной попытки
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-proof/proof.json
          retention-days: 30
          if-no-files-found: error
