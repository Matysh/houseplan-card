name: "Бета: пакетное ревью ship · тело (#716)"

# #696, PROCESS.md §11.7: задачи `track:ship` сливаются без ревью модели —
# правка в механических рамках и зелёный лёгкий Validate. Их код читается
# пакетно ночью; перед бетой — только непрочитанные или изменённые задачи.
# Гейт публикации беты (`ship-review.mjs check`) требует покрытие всех ship-задач
# диапазона «прошлый тег..кандидат»; ночного документа с тем же патч-набором
# достаточно, отдельный документ тега беты нужен не всегда (#727).
#
# Три job, как у release-review.yml (#551, #556): детерминированный вход,
# модель без права записи, детерминированная публикация документа в `dev`.
#
# #727: `tag=nightly` — ночной режим. Его запускает `_nightly.yml` после
# полного Validate с `candidate` = голова `dev` того прогона. Читаются только
# ship-задачи без покрытия или изменившиеся после ревью (`shipCoverage`), документ —
# `SHIP-REVIEW-<база>-dev-<sha12>.md`. Бета так же читает только дельту.

on:
  # #716: тело вызывается тонким файлом `ship-review.yml` по ссылке `@dev`;
  # кнопка, входы ручного запуска, run-name и concurrency живут там. Без
  # файла в ветке по умолчанию GitHub не даёт запустить workflow_dispatch вовсе.
  workflow_call:
    inputs:
      source_event:
        description: Authenticated routing context from the dev receiver; empty for legacy callers
        type: string
        required: false
        default: ""
      source_event_name:
        type: string
        required: false
        default: ""
      # #727: `nightly` — зарезервированное значение (ночной режим, candidate обязателен).
      tag:
        description: "Beta tag the review is for, for example v1.79.0-beta.1"
        required: true
        type: string
      candidate:
        description: "Exact candidate SHA; empty = the dev tip"
        required: false
        type: string
        default: ""
      force:
        description: "Review again even when the document already exists in dev"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Concurrency уровня workflow — у вызывающего `ship-review.yml` (#716).

jobs:
  prepare:
    name: "Ship-ревью: задачи диапазона"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      proceed: ${{ steps.range.outputs.proceed }}
      candidate: ${{ steps.range.outputs.candidate }}
      base: ${{ steps.range.outputs.base }}
      doc: ${{ steps.range.outputs.doc }}
      issues: ${{ steps.range.outputs.issues }}
      mode: ${{ steps.range.outputs.mode }}
      patches: ${{ steps.range.outputs.patches }}
      subject: ${{ steps.range.outputs.subject }}
      input_manifest: ${{ steps.range.outputs.input_manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: dev
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Кандидат, база и ship-задачи
        id: range
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CANDIDATE: ${{ inputs.candidate }}
          FORCE: ${{ inputs.force }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Отказ prepare за `| tee` не должен читаться как «ship-задач нет» (#727).
          set -o pipefail
          git fetch -q --tags origin
          # #727: tag=nightly без candidate — отказ до подстановки вершины dev.
          node scripts/ship-review.mjs mode --tag="$TAG" --candidate="$CANDIDATE"
          if [ -z "$CANDIDATE" ]; then CANDIDATE=$(git rev-parse origin/dev); fi
          git cat-file -e "$CANDIDATE^{commit}"
          CANDIDATE=$(git rev-parse "$CANDIDATE^{commit}")
          doc=$(node scripts/ship-review.mjs doc --tag="$TAG" --candidate="$CANDIDATE")
          if [ "$FORCE" != "true" ] && git cat-file -e "origin/dev:$doc" 2>/dev/null; then
            echo "::notice::$doc уже есть в dev — повторное ревью не запускается (force=true, чтобы переснять)"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          out="$RUNNER_TEMP/ship-review-input"
          node scripts/ship-review.mjs prepare --tag="$TAG" --candidate="$CANDIDATE" --force="$FORCE" --context=true \
            --out="$out" --repo="${{ github.repository }}" --run-url="$RUN_URL" | tee "$RUNNER_TEMP/range.txt"
          cat "$RUNNER_TEMP/range.txt" >> "$GITHUB_OUTPUT"
          echo "candidate=$CANDIDATE" >> "$GITHUB_OUTPUT"
          issues=$(sed -n 's/^issues=//p' "$RUNNER_TEMP/range.txt")
          if [ -z "$issues" ]; then
            # #727 К5: пустая дельта — все ship-задачи покрыты документами базы.
            note=$(sed -n 's/^note=//p' "$RUNNER_TEMP/range.txt")
            echo "::notice::${note:-ship-задач в диапазоне нет — ревью не нужно}"
            if [ -n "$note" ]; then echo "- $note" >> "$GITHUB_STEP_SUMMARY"; fi
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          (cd "$out" && sha256sum brief.md ship-issues.json review-source-context.json > manifest.sha256)
          echo "input_manifest=$(sha256sum "$out/manifest.sha256" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          cat "$out/brief.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Передать вход модели
        if: steps.range.outputs.proceed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ship-review-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ship-review-input
          if-no-files-found: error
          retention-days: 3

  model_review:
    name: "Ship-ревью: работа модели"
    needs: prepare
    if: needs.prepare.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # #737: строка расхода сессии модели (scripts/model-usage.mjs).
    outputs:
      usage: ${{ steps.usage.outputs.line }}
      usage_details: ${{ steps.usage.outputs.details }}
      artifact: ${{ steps.result.outputs.artifact }}
      producer_run_id: ${{ steps.result.outputs.producer_run_id }}
      producer_attempt: ${{ steps.result.outputs.producer_attempt }}
      producer_manifest: ${{ steps.result.outputs.producer_manifest }}
    # Недоверенная стадия без права записи (#556): документ публикует
    # `publish`. Native transport не обменивает OIDC на App-токен.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Получить вход
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ship-review-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ship-review-input

      - name: Проверить вход и кандидата
        env:
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: |
          (cd "$RUNNER_TEMP/ship-review-input" && sha256sum -c manifest.sha256)
          test "$(git rev-parse HEAD)" = "$CANDIDATE"

      - name: Установить зависимости
        run: npm ci

      - name: Кэш браузеров Playwright
        id: pw
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Установить Chromium
        if: steps.pw.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # Тот же обход, что у конвейера (_process.yml, anthropics issue 1817).
      - name: "Получить accepted review policy (#1065)"
        id: policy_tools
        run: |
          tools="$RUNNER_TEMP/review-policy-tools"
          mkdir -p "$tools"
          git archive origin/dev scripts | tar -x -C "$tools"
          echo "sha=$(git rev-parse origin/dev)" >> "$GITHUB_OUTPUT"

      - name: Подготовить проверенный контекст ревью
        env:
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: |
          node "$RUNNER_TEMP/review-policy-tools/scripts/review-context.mjs" --kind=ship --sha="$CANDIDATE" \
            --input="$RUNNER_TEMP/ship-review-input/review-source-context.json" --output="$RUNNER_TEMP/review-context.json"

      - name: Установить Claude Code детерминированно
        id: claude_bin
        run: |
          ver=$(node "$RUNNER_TEMP/review-policy-tools/scripts/review-execution-policy.mjs" version)
          base=https://downloads.claude.ai/claude-code-releases
          bin="$RUNNER_TEMP/review-cli/claude"
          mkdir -p "$(dirname "$bin")"
          curl -fsSL --retry 3 "$base/$ver/linux-x64/claude" -o "$bin"
          sum=$(curl -fsSL --retry 3 "$base/$ver/manifest.json" | jq -r '.platforms["linux-x64"].checksum')
          echo "$sum  $bin" | sha256sum -c -
          chmod +x "$bin"
          actual=$("$bin" --version)
          test "${actual%% *}" = "$ver"
          echo "$actual"
          echo "path=$bin" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: "Ограничить инструменты ревью (#1065)"
        env:
          REVIEW_KIND: ship
          REVIEW_CLAUDE_VERSION: ${{ steps.claude_bin.outputs.version }}
          REVIEW_BASE: ${{ needs.prepare.outputs.base }}
          REVIEW_DOC: ${{ runner.temp }}/ship-review.md
        run: |
          node "$RUNNER_TEMP/review-policy-tools/scripts/review-execution-policy.mjs" prepare "$RUNNER_TEMP/review-execution-policy.json"

      - name: Подготовить native review prompt
        env:
          REVIEW_PROMPT: ${{ runner.temp }}/review-prompt.txt
          REVIEW_PROMPT_TEXT: |
            Ты ревьюер кода проекта House Plan. Язык ответа — русский.

            Разрешённые абсолютные пути (не вычисляй их shell/env-командой):
            REVIEW_DOC: ${{ runner.temp }}/ship-review.md
            REVIEW_INPUT: ${{ runner.temp }}/ship-review-input
            REVIEW_CONTEXT: ${{ runner.temp }}/review-context.json

            Сначала Read REVIEW_CONTEXT и перечисленные в нём страницы:
            полный проверенный контекст уже подготовлен, shell/MCP GitHub не нужен.

            ${{ needs.prepare.outputs.subject }}
            Кандидат ${{ needs.prepare.outputs.candidate }} (рабочая копия уже на нём) · база
            диапазона: ${{ needs.prepare.outputs.base || 'нет' }}.
            Задачи: ${{ needs.prepare.outputs.issues }} — вход в $REVIEW_INPUT/brief.md
            (строка ТЗ каждой задачи и её коммиты) и $REVIEW_INPUT/ship-issues.json.

            Эти задачи шли по треку ship и слиты в dev без ревью модели: правка
            в механических рамках и зелёный лёгкий Validate. Ты — первый, кто
            читает их код. Сначала прочитай docs/process/REVIEWER.md: «Позиция
            ревьюера», «Код-ревью», «Объём гейтов», «Пакетное ревью ship»;
            канон — PROCESS.md §2.7, §5 и §11.7.

            По каждой задаче сначала прочитай требования и решения владельца,
            затем независимо проследи precomputed git facts и diff каждого коммита:
            изменённый код, вызывающие пути, инварианты, побочные эффекты и отказы.
            Проверь применимые гипотезы дефектов: реальное окружение против
            фикстуры, холодное/прогретое состояние, границы входов, ошибки
            зависимостей, отмена и гонки. Авторское объяснение, хендофф, тесты
            и proof сопоставь после этого. Зелёный proof подтверждает выполненные
            проверки, а не корректность реализации или полноту сценариев.
            Делает ли код
            то, что сказано в строке ТЗ, и только это; не ломает ли соседнее
            поведение; не вышла ли правка из трека ship по смыслу (новый
            UX-контракт, геометрия, конфиг, перф) — это находка Medium с
            предложением трека. Проверь неверные/неоднозначные конструкции,
            читаемость, ненужное усложнение и дублирование; при замене пути —
            что удалено взамен добавленного (§7.2). Замечание по качеству называет
            конкретное последствие, неоднозначность или стоимость сопровождения
            и местное улучшение. Вкусовщина и квота находок недопустимы;
            серьёзность — по последствиям.

            Используй пригодный proof, не повторяй покрытые проверки. Дополнительное
            исполнение — адресно для конкретного непокрытого AC/риска или
            непригодного evidence, например выбранного смоука из
            `node scripts/smoke-select.mjs --base <sha>^ --head <sha>`.
            Полные наборы — предрелизный гейт, а не прогон на каждую задачу.
            Доступный соразмерный исполнимый oracle нельзя подменять чтением:
            его отсутствие — находка, но не результат «тест упал».

            Серьёзность: High — дефект, который увидит пользователь беты, или
            правка не делает заявленного; High блокирует публикацию беты.
            Medium — поведение вне заявленного или вне рамок трека;
            качество и оставшийся заменённый путь оценивай по §2.7 и §7.2,
            с конкретными последствиями. Low — мелкие замечания без таких
            последствий. Находка чинится отдельной задачей, ты ничего не правишь.

            Ты ничего не правишь и не публикуешь: ни код, ни issue, ни
            комментарии. Права на запись у тебя нет. Любые изменения рабочей
            копии запрещены; обычные generated outputs build/test допустимы.
            Не изменяй и не восстанавливай предмет ревью ради negative witness.

            Tool policy #1065: Read/Grep/Glob для чтения, Write только во внешний
            REVIEW_DOC. Общего Bash/Edit/Agent и business MCP нет.
            REVIEW_CHECKS: ${{ runner.temp }}/review-execution-policy.json.checks.md
            Для нужного исполняемого oracle прочитай manifest и вызови только
            mcp__houseplan_review__run_check с его check_id; bin/argv/env/cwd не задавай.
            ToolSearch допустим только для discovery этого фиксированного runner.
            executed:false/unavailable не является ни PASS, ни выполненным тестом.
            Denied/missing/mismatch/material drift остаются fatal; не повторяй
            неподдержанный запрос обходной командой. Доступный oracle выполняй
            через runner, а не заменяй чтением. При непригодном evidence дай честную границу.

            Напиши документ в файл по пути из переменной REVIEW_DOC (абсолютный,
            вне репозитория). Первой строкой после заголовка —
            `Итог: High N · Medium N · Low N`. Затем по задаче на раздел
            `## #NN — заголовок`: что проверил (команда → результат), находки с
            воспроизведением, чего не проверял.

            Затем верни JSON по схеме — последнее обязательное действие.
        run: node "$RUNNER_TEMP/review-policy-tools/scripts/review-native-runner.mjs" prepare-prompt

      - name: Review
        id: review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REVIEW_CLI_PATH: ${{ steps.claude_bin.outputs.path }}
          REVIEW_POLICY: ${{ runner.temp }}/review-execution-policy.json
          REVIEW_PROMPT: ${{ runner.temp }}/review-prompt.txt
          REVIEW_JSON_SCHEMA: '{"type":"object","properties":{"high":{"type":"integer"},"medium":{"type":"integer"},"low":{"type":"integer"},"summary":{"type":"string"}},"required":["high","medium","low","summary"]}'
          REVIEW_KIND: ship
          REVIEW_MAX_TURNS: 150
          REVIEW_EXECUTION_DIR: ${{ runner.temp }}/review-native-execution
          REVIEW_DOC: ${{ runner.temp }}/ship-review.md
        run: node "$RUNNER_TEMP/review-policy-tools/scripts/review-native-runner.mjs"

      # #737: как у конвейера (_process.yml) — расход выходом job, не через
      # artifact; execution_file не выгружается и не печатается.
      - name: Снять расход модели
        id: usage
        if: always()
        continue-on-error: true
        env:
          EXEC: ${{ steps.review.outputs.execution_file }}
        run: |
          line=$(node scripts/model-usage.mjs --execution-file="$EXEC")
          echo "line=$line" >> "$GITHUB_OUTPUT"
          details=$(node scripts/model-usage-details.mjs --execution-file="$EXEC")
          echo "details=$details" >> "$GITHUB_OUTPUT"
          summary=$(node scripts/model-usage-details.mjs --summary-line="$details")
          echo "- модели/outcome: $summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- расход модели: \`$line\`" >> "$GITHUB_STEP_SUMMARY"

      - name: "Проверить execution boundary (#1065)"
        id: execution_boundary
        env:
          REVIEW_EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          REVIEW_STRUCTURED_OUTPUT: ${{ steps.review.outputs.structured_output }}
          REVIEW_DOC: ${{ runner.temp }}/ship-review.md
        run: node "$RUNNER_TEMP/review-policy-tools/scripts/review-execution-policy.mjs" audit "$RUNNER_TEMP/review-execution-policy.json"

      - name: "Собрать безопасную диагностику отказа (#1082)"
        id: failure_diagnostics
        if: always() && (steps.review.outcome == 'failure' || steps.execution_boundary.outcome == 'failure')
        env:
          REVIEW_EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          REVIEW_DIAGNOSTIC_TRACE_FALLBACK: ${{ runner.temp }}/review-native-execution/native-messages.json
          REVIEW_DIAGNOSTIC_POLICY: ${{ runner.temp }}/review-execution-policy.json
          REVIEW_DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/review-failure-diagnostics/certificate.json
          REVIEW_DIAGNOSTIC_KIND: ship
          REVIEW_DIAGNOSTIC_STAGE: ship
          REVIEW_DIAGNOSTIC_SHA: ${{ needs.prepare.outputs.candidate }}
          REVIEW_DIAGNOSTIC_TOOLS_SHA: ${{ steps.policy_tools.outputs.sha }}
        run: node "$RUNNER_TEMP/review-policy-tools/scripts/review-failure-diagnostics.mjs"

      - name: "Сохранить диагностику отказа, не вердикт (#1082)"
        if: always() && (steps.review.outcome == 'failure' || steps.execution_boundary.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-failure-diagnostics-ship-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.failure_diagnostics.outputs.certificate }}
          if-no-files-found: error
          retention-days: 1

      - name: Запечатать результат модели
        id: result
        env:
          SOURCE: ${{ runner.temp }}/ship-review.md
          OUT: ${{ steps.review.outputs.structured_output }}
          USAGE_DETAILS: ${{ steps.usage.outputs.details }}
          REPO: ${{ github.repository }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          BASE: ${{ needs.prepare.outputs.base }}
          DOC: ${{ needs.prepare.outputs.doc }}
          INPUT_MANIFEST: ${{ needs.prepare.outputs.input_manifest }}
        run: |
          node scripts/model-usage-details.mjs --require-complete-line="$USAGE_DETAILS"
          test -s "$SOURCE" || { echo "::error::модель не оставила документ ревью"; exit 1; }
          dir="$RUNNER_TEMP/ship-review-result"
          mkdir -p "$dir"
          printf '%s' "$OUT" > "$dir/result.json"
          jq -e '(.high|type=="number") and (.medium|type=="number") and (.low|type=="number") and (.summary|type=="string")' \
            "$dir/result.json" >/dev/null
          cp "$SOURCE" "$dir/ship-review.md"
          jq -n --arg repo "$REPO" --arg candidate "$CANDIDATE" --arg base "$BASE" --arg document "$DOC" \
            --arg input_manifest "$INPUT_MANIFEST" --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{schema:1,kind:"ship",repo:$repo,candidate:$candidate,base:$base,document:$document,input_manifest:$input_manifest,run_id:$run_id,run_attempt:$run_attempt}' > "$dir/producer.json"
          (cd "$dir" && sha256sum ship-review.md result.json producer.json > manifest.sha256)
          echo "producer_run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "producer_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "producer_manifest=$(sha256sum "$dir/manifest.sha256" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "artifact=ship-review-result-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Передать результат публикации
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.result.outputs.artifact }}
          path: ${{ runner.temp }}/ship-review-result
          if-no-files-found: error
          retention-days: 3

  publish:
    name: "Ship-ревью: документ в dev"
    needs: [prepare, model_review]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: dev
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Получить результат модели
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.model_review.outputs.artifact }}
          path: ${{ runner.temp }}/ship-review-result

      - name: Проверить исходный producer результата
        env:
          REPO: ${{ github.repository }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          BASE: ${{ needs.prepare.outputs.base }}
          DOC: ${{ needs.prepare.outputs.doc }}
          INPUT_MANIFEST: ${{ needs.prepare.outputs.input_manifest }}
          REVIEW_PRODUCER_RUN_ID: ${{ needs.model_review.outputs.producer_run_id }}
          REVIEW_PRODUCER_ATTEMPT: ${{ needs.model_review.outputs.producer_attempt }}
          REVIEW_PRODUCER_MANIFEST: ${{ needs.model_review.outputs.producer_manifest }}
          REVIEW_PRODUCER_RESULT: ${{ needs.model_review.result }}
        run: node scripts/review-result-gate.mjs --batch=ship --dir="$RUNNER_TEMP/ship-review-result"

      # Модель пишет только текст. Путь, машинный блок (его читает гейт беты),
      # индекс и коммит решает этот шаг. #727: `mode` и `patches` блока — из
      # prepare (детерминированный патч-набор), не из результата модели.
      - name: Опубликовать документ
        env:
          TOKEN: ${{ secrets.HP_PROCESS_TOKEN }}
          TAG: ${{ inputs.tag }}
          DOC: ${{ needs.prepare.outputs.doc }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          BASE: ${{ needs.prepare.outputs.base }}
          ISSUES: ${{ needs.prepare.outputs.issues }}
          MODE: ${{ needs.prepare.outputs.mode }}
          PATCHES: ${{ needs.prepare.outputs.patches }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # #737: расход модели — строкой сразу после блока; недоверенный ввод.
          USAGE: ${{ needs.model_review.outputs.usage }}
          USAGE_DETAILS: ${{ needs.model_review.outputs.usage_details }}
        run: |
          dir="$RUNNER_TEMP/ship-review-result"
          (cd "$dir" && sha256sum -c manifest.sha256)
          test "$DOC" = "$(node scripts/ship-review.mjs doc --tag="$TAG" --candidate="$CANDIDATE")"
          high=$(jq -r '.high' "$dir/result.json")
          medium=$(jq -r '.medium' "$dir/result.json")
          low=$(jq -r '.low' "$dir/result.json")
          # Сообщение коммита — построчно в файл, без heredoc в `run:` (#730, как #723).
          # #748: ночью — своё: имя документа без префикса, задача ночного режима.
          if [ "$MODE" = "nightly" ]; then
            night=${DOC##*/SHIP-REVIEW-}
            subject="docs: nightly ship review ${night%.md}"
            lead="Ночное пакетное ревью задач track:ship (PROCESS.md §11.7)."
            issue="#727"
          else
            subject="docs: ship review for $TAG"
            lead="Пакетное ревью задач track:ship перед бетой (PROCESS.md §11.7)."
            issue="#696"
          fi
          msg="$RUNNER_TEMP/ship-review-commit.txt"
          push_err="$RUNNER_TEMP/ship-review-push.stderr"
          # #766: хост push — сервер раннера (GITHUB_SERVER_URL), не зашитый github.com.
          server="${GITHUB_SERVER_URL:-https://github.com}"
          push_url="${server%%://*}://x-access-token:$TOKEN@${server#*://}/${{ github.repository }}"
          for attempt in 1 2 3; do
            git fetch -q origin dev
            git reset -q --hard origin/dev
            git clean -fdq
            mkdir -p docs/reviews
            {
              cat "$dir/ship-review.md"
              printf '\n\n'
              node -e '
                import("./scripts/ship-review.mjs").then((m) => process.stdout.write(m.anchorBlock({
                  tag: process.env.TAG, candidate: process.env.CANDIDATE, base: process.env.BASE || null,
                  issues: String(process.env.ISSUES || "").split(",").filter(Boolean).map(Number),
                  high: Number(process.argv[1]), medium: Number(process.argv[2]), low: Number(process.argv[3]),
                  runUrl: process.env.RUN_URL, mode: process.env.MODE, patches: m.parsePatches(process.env.PATCHES),
                  usage: process.env.USAGE ?? "",
                  usageDetails: process.env.USAGE_DETAILS ?? "",
                })));
              ' "$high" "$medium" "$low"
            } > "$DOC"
            node scripts/reviews-index.mjs --dir=docs/reviews --strict
            git add -- "$DOC" docs/reviews/INDEX.md
            git diff --cached --name-only | node scripts/review-doc-guard.mjs
            {
              echo "$subject"
              echo ""
              echo "$lead"
              echo "Задачи: $ISSUES. Итог: High $high · Medium $medium · Low $low."
              echo ""
              echo "Issue: $issue"
              echo "User-Visible: no"
            } > "$msg"
            git -c user.name="claude[bot]" \
                -c user.email="209825114+claude[bot]@users.noreply.github.com" \
                commit -q -F "$msg"
            git diff --name-only "origin/dev...HEAD" | node scripts/review-doc-guard.mjs
            if git push -q "$push_url" HEAD:dev 2> "$push_err"; then
              if [ "$MODE" = "nightly" ]; then
                echo "### Ночное пакетное ревью ship" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "### Предрелизное пакетное ревью ship $TAG" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "Задачи $ISSUES · High $high · Medium $medium · Low $low — \`$DOC\` в dev." >> "$GITHUB_STEP_SUMMARY"
              echo "::notice::$DOC опубликован: High $high · Medium $medium · Low $low"
              exit 0
            fi
            # #730: сдвигом dev считается только устаревший lease — отказ
            # разбирает код слияния (merge-candidate.mjs --push-refusal, #705),
            # как у ревью релиза (#723). Скрипт — из dev: рабочая копия только что
            # сброшена на origin/dev. Отказ GitHub (право на workflow, правило
            # ветки, хук) повтор не лечит: шаг останавливается, причина и ответ
            # git без токена — в журнале и в сводке шага.
            kind=$(node scripts/merge-candidate.mjs --push-refusal="$push_err" --ref=dev \
              --stage=ship-review --summary="$GITHUB_STEP_SUMMARY") || kind=unknown
            if [ "$kind" != "stale" ]; then
              echo "::error::push $DOC в dev отклонён ($kind) — это не сдвиг dev, повтор не поможет; причина и ответ git — выше и в сводке шага"
              exit 1
            fi
            echo "::warning::dev ушёл вперёд — попытка $attempt из 3, документ собирается заново"
            sleep $((attempt * 10))
          done
          echo "::error::документ ревью не опубликован в dev за три попытки"
          exit 1

      # #727 К8: High ночного документа — одна строка в каждую его задачу.
      # Повтор на тот же документ не пишется (метка hp:ship-review-high doc=…),
      # Medium и Low в issue не идут — их решает владелец (§11.7). Режим и
      # High проверяет и скрипт: шаг вне ночи или без High ничего не пишет.
      - name: High ночью — строка в задачи документа
        if: needs.prepare.outputs.mode == 'nightly'
        env:
          GH_TOKEN: ${{ secrets.HP_PROCESS_TOKEN }}
          MODE: ${{ needs.prepare.outputs.mode }}
          DOC: ${{ needs.prepare.outputs.doc }}
          ISSUES: ${{ needs.prepare.outputs.issues }}
        run: |
          high=$(jq -r '.high' "$RUNNER_TEMP/ship-review-result/result.json")
          node scripts/ship-review.mjs comment-high --mode="$MODE" --high="$high" --doc="$DOC" \
            --issues="$ISSUES" --repo="${{ github.repository }}"
