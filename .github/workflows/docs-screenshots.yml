# Replace docs-screenshots.yml only in the diagnostic archive branch.
name: 1065 native diagnostic carrier
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact final 1065 source commit; no branch/ref alias
        required: true
        type: string
permissions:
  contents: read
jobs:
  native_compatibility:
    if: github.repository == 'Matysh/houseplan-card' && github.ref == 'refs/heads/codex/archive/1065-native-probe' && github.run_attempt == 1
    uses: ./.github/workflows/1065-native-probe.yml
    with:
      source_sha: ${{ inputs.source_sha }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
