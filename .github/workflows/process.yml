# Generated by scripts/service-workflows.mjs (#1040); mirrored to main.
# main only delivers; authenticated work runs on dev. Failures are not hidden.
name: "Ревью-конвейер"
run-name: "${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.delivery || '{}').title || format('relay process #{0} · {1} · {2}', github.event.issue.number, github.event.label.name, github.event.issue.title) }}"

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      delivery:
        description: "Internal immutable origin locator; leave empty for an ordinary dev dispatch"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  event:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'S4-spec-review' || github.event.label.name == 'S7-code-review'
    permissions:
      contents: write
      actions: write
    uses: Matysh/houseplan-card/.github/workflows/_service-event.yml@dev # #1040: trusted delivery code from dev
    with:
      workflow: process.yml
      parameters: ${{ toJSON(inputs) }}
    secrets: inherit
  dev:
    needs: event
    if: needs.event.outputs.accepted == 'true'
    permissions:
      contents: read
      issues: write
    uses: Matysh/houseplan-card/.github/workflows/_process.yml@dev # #1040: reviewed execution body from dev
    with:
      source_event: ${{ needs.event.outputs.event }}
      source_event_name: ${{ needs.event.outputs.event_name }}
    secrets: inherit
