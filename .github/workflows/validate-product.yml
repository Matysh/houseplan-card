concurrency:
  group: validate-product-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: "Предполёт: документация, провенанс, процесс"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # `actions: read` — чтение списка прогонов Validate (#388), `issues: read` —
    # проверка 8 процессного гейта, `issues: write` — одно issue о расхождении
    # зеркала workflow на push в dev (#700). Права перечислены явно, потому что
    # job обращается к API сверх содержимого репозитория.
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      # `blob:none` при полной истории (#345): этой job нужны сообщения
      # коммитов, трейлеры и ИМЕНА изменённых файлов, а не содержимое старых
      # ревизий. Полный клон стоит 215 МБ против 26 МБ, и 32% этого веса —
      # скриншоты документации, переснятые 196 раз.
      #
      # Коммиты и деревья скачиваются целиком, поэтому диапазоны и `merge-base`
      # работают как раньше. Единственная догрузка по требованию здесь —
      # `git show origin/main:.github/workflows/<тонкий файл>`: по блобу на файл.
      # `fetch-tags: true` (#703): теги релиза — граница проверенного материала
      # для базы диапазона, а checkout по умолчанию качает с `--no-tags`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, filter: 'blob:none', fetch-tags: true }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22 }

      # Свежесть скриншотов на обычном пуше — предупреждение, на кандидате беты
      # (трейлер `Release:`), по кнопке и на PR — ошибка (#479). Остальные
      # проверки документации красят всегда. Режим считает тот же скрипт, что и
      # выход `heavy` job `changes`, чтобы два места не разошлись.
      - name: "Документация: гайды, ченджлоги, скриншот-индекс"
        id: docs
        continue-on-error: true
        env:
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          FULL_INPUT: ${{ inputs.full }}
          # #697: на ветке задачи `Release:` строгий режим не включает.
          REF_NAME: ${{ github.ref_name }}
        run: |
          # #700: на ветке задачи упавший чужой сайт — предупреждение, а не
          # красный preflight; push в dev, кандидат и релиз судят ссылки строго.
          external=--external
          case "$REF" in refs/heads/issue/*) external=--external=warn ;; esac
          # #586: CLI отдаёт ОДИН ответ. Прежде здесь сравнивался со строкой
          # `heavy=true` весь вывод `--heavy`, а он двухстрочный: в `$(…)`
          # строки схлопываются через пробел, сравнение не совпадало никогда,
          # и строгий режим не включился ни на одном кандидате.
          mode=$(node scripts/classify-changes.mjs --screenshots-mode)
          echo "скриншоты документации: режим $mode"
          node scripts/check-docs.mjs "$external" --screenshots=$mode

      # #635: `docs/reviews/INDEX.md` — снимок каталога ревью; расхождение с
      # каталогом — невидимые через индекс документы (r2 #635 H1). Гейт стоит
      # только на push в dev: там свежесть держит конвейер — пересборка при
      # публикации документа и после каждого своего ребейза (приведение к dev,
      # слияние кандидата). На issue-ветках не судится: их ребейзит и
      # публикует в них конвейер из ветки по умолчанию, и доехавший туда
      # документ раунда индекс ветки знать не обязан — красить автора за
      # коммит конвейера нельзя; расхождение излечивает слияние.
      - name: "Индекс ревью совпадает с каталогом docs/reviews"
        id: reviews_index
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        continue-on-error: true
        run: node scripts/reviews-index.mjs --dir=docs/reviews --check

      # #623: для событий `issues`, `schedule` и `workflow_run` GitHub берёт
      # workflow из ветки по умолчанию (`main`). Там лежат тонкие вызывающие
      # файлы — триггеры, run-name, права, concurrency, — а тело каждого
      # (`_<имя>.yml`) они вызывают по ссылке `@dev`. Правка конвейера — один
      # коммит в `dev`; тела здесь не сверяются: их копия в `main` не исполняется
      # ни одним событием. Тонкий файл сверяется: правка триггера или потолка
      # прав, не доехавшая до `main`, действовала бы только в dev-копии.
      #
      # #716: `ship-review.yml` и `beta-derived.yml` — только `workflow_dispatch`,
      # он исполняет файл с выбранной ветки, но запуск GitHub даёт лишь workflow,
      # чей файл есть в `main`. Шагам беты он нужен до промоушена, поэтому они
      # устроены так же и сверяются здесь же: правка входа или потолка прав,
      # не доехавшая до `main`, не действовала бы в запуске с `main`, а именно
      # его кнопка выбирает по умолчанию.
      #
      # `performance.yml` не входит: по расписанию он судит `main` собственным
      # телом из `main`, расхождение с `dev` до промоушена законно. Список ниже
      # держит равным множеству тонких файлов
      # test/default-branch-workflows.test.mjs.
      - name: "Процесс: тонкие вызывающие workflow идентичны в main и dev"
        id: workflow_sync
        continue-on-error: true
        run: |
          git fetch --quiet origin main dev
          status=0
          for file in process.yml mutation-gate.yml process-resume.yml nightly.yml process-reconcile.yml process-metrics.yml ship-review.yml beta-derived.yml; do
            if diff <(git show "origin/main:.github/workflows/$file") \
                    <(git show "origin/dev:.github/workflows/$file"); then
              echo "$file: main и dev идентичны"
            else
              echo "РАСХОЖДЕНИЕ: $file в main и dev различаются."
              echo "Тонкий вызывающий файл исполняется из ветки по умолчанию,"
              echo "поэтому правку триггеров или прав нужно зеркалить в main (#623)."
              status=1
            fi
          done
          exit $status

      # #700: расхождение зеркала на dev — одно открытое issue владельцу, как у
      # ночного мутационного гейта (#472): чинит его тот, кто зеркалит в main, а
      # не автор задачи, чья ветка ни при чём. Сбой API — предупреждение: шаг
      # сообщает, а не судит.
      - name: "Расхождение зеркала на dev — issue владельцу"
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && steps.workflow_sync.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker="[workflow-sync]"
          # Список не прочитан — нового issue нет: иначе сбой сети или
          # рейт-лимит плодил бы дубликат к уже открытому (r1 #700).
          if ! existing=$(gh issue list --repo "$REPO" --state open --search "\"$marker\" in:title" \
            --json number,title --jq '[.[] | select(.title | startswith("[workflow-sync]"))][0].number // empty'); then
            echo "::warning::открытые issue не прочитаны — новое не заводится, чтобы не завести дубликат"
            exit 0
          fi
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "Расхождение повторилось: $RUN_URL" \
              || echo "::warning::комментарий в #$existing не оставлен"
            exit 0
          fi
          cat > /tmp/workflow-sync.md <<EOF
          Тонкие вызывающие workflow в \`main\` и \`dev\` различаются. Прогон: $RUN_URL

          Тонкий файл исполняется из ветки по умолчанию, поэтому правку триггеров, входов или прав нужно зеркалить в \`main\` (PROCESS.md §10.4, #623). На ветках задач это предупреждение (#700), на push в \`dev\` — красный preflight, пока зеркало не выровнено.
          EOF
          gh issue create --repo "$REPO" --title "$marker тонкие workflow в main и dev различаются" \
            --label infra --label process --body-file /tmp/workflow-sync.md \
            || echo "::warning::issue о расхождении зеркала не заведено"

      # Оба гейта ниже судят САМ диапазон коммитов, а не объём проверок, и до
      # #388 брали его от головы предыдущего пуша. Прогон предыдущего пуша
      # штатно отменяется следующим (concurrency), и тогда его коммиты не судит
      # никто: свой прогон отменён, а следующий пуш сравнивает уже с ними.
      #
      # База — последний предок с УСПЕШНО завершённым Validate. Фолбэк остаётся
      # прежним `before`: расширять диапазон здесь нельзя, иначе гейт, который
      # сам красит прогон, лишает следующий пуш зелёного предка и запирает dev
      # в красноте навсегда.
      #
      # #703: то же на `main`. Stable-промоушен — пуш в `main` SHA, уже
      # судимого на `dev`; с `event.before` (прошлый stable) провенанс и
      # процессный гейт судили бы всю бета-линию заново. Прогоны читаются с
      # обеих интеграционных веток, сам HEAD засчитывает только успешный.
      - name: "База диапазона: последний доказанно зелёный предок"
        id: range
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          FALLBACK: ${{ github.event.before }}
        run: |
          # `status=completed`, а не `success`: гейтам диапазона нужен факт
          # «коммит судили», а не «вердикт был оправдательный». Упавший прогон
          # коммит судил; отменённый — нет, его отсеивает judgedShas (#388).
          for branch in dev main; do
            gh api -X GET "repos/$REPO/actions/runs" \
              -f branch="$branch" -f status=completed -F per_page=100 \
              > "/tmp/validate-runs-$branch.json" || echo '{}' > "/tmp/validate-runs-$branch.json"
          done
          node scripts/classify-base.mjs --head="$HEAD_SHA" --mode=range \
            --fallback="$FALLBACK" \
            --runs=/tmp/validate-runs-dev.json --runs=/tmp/validate-runs-main.json
      - name: "Провенанс коммитов: трейлеры и эталоны"
        id: provenance
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ steps.range.outputs.base || github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          DEVELOPMENT_BRANCH: dev
        run: |
          git fetch -q origin "refs/heads/$DEVELOPMENT_BRANCH:refs/remotes/origin/$DEVELOPMENT_BRANCH"
          node scripts/validate-commit-provenance.mjs --check-hook-mode --github-range

      # Догоняющая проверка процесса (PROCESS.md §10.3). Хуки ловят нарушение на
      # машине автора, но их можно обойти `--no-verify`, а коммиты идут прямо в
      # dev без PR — GitHub на своей стороне не блокирует ничего. Это последнее
      # место, где нарушение правила №1 ловится машиной. Откат — удалить шаг,
      # скрипт остаётся рабочим.
      - name: "Процессный гейт: диапазон, трейлеры, статусы issue"
        id: process_gate
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ steps.range.outputs.base || github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          DEVELOPMENT_BRANCH: dev
          TARGET_REF: ${{ github.ref }}
          # Публичный репозиторий: штатного токена хватает на чтение issue.
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin "refs/heads/$DEVELOPMENT_BRANCH:refs/remotes/origin/$DEVELOPMENT_BRANCH"
          node scripts/process-gate.mjs --github-range --issues

      # Вердикт обязан быть громким и перечислять всё упавшее сразу: иначе
      # слияние job стоило бы автору лишнего круга «починил одно — узнал о
      # втором».
      # #556: перемещаемая ссылка в `uses:` — доверие чужому владельцу тега
      # здесь и сейчас, а не коду, который читали. Проверка стоит в preflight:
      # она стоит миллисекунды и ловит правку, которая иначе доехала бы до
      # привилегированной стадии.
      - name: "Сторонние Actions закреплены полным SHA"
        id: action_pins
        continue-on-error: true
        run: node scripts/action-pins.mjs

      - name: Вердикт предполётных проверок
        env:
          DOCS: ${{ steps.docs.outcome }}
          WORKFLOW_SYNC: ${{ steps.workflow_sync.outcome }}
          PROVENANCE: ${{ steps.provenance.outcome }}
          PROCESS_GATE: ${{ steps.process_gate.outcome }}
          ACTION_PINS: ${{ steps.action_pins.outcome }}
          REVIEWS_INDEX: ${{ steps.reviews_index.outcome }}
          REF: ${{ github.ref }}
        run: |
          fail=0
          check() {
            if [ "$2" = "success" ]; then
              echo "ok   $1"
            else
              echo "FAIL $1 ($2)"
              echo "- **$1**: $2" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
          }
          # #700: причина, к которой ветка задачи отношения не имеет, — в сводку
          # предупреждением; на dev, кандидате и релизе она красит как прежде.
          advise() {
            if [ "$2" = "success" ]; then
              echo "ok   $1"
            else
              echo "::warning::$1 ($2) — на ветке задачи предупреждение (#700)"
              echo "- $1: $2 — предупреждение, чинит релиз-менеджер (#700)" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          task_branch=false
          case "$REF" in refs/heads/issue/*) task_branch=true ;; esac
          echo "### Предполётные проверки" >> "$GITHUB_STEP_SUMMARY"
          check "документация" "$DOCS"
          if [ "$task_branch" = "true" ]; then
            advise "тонкие вызывающие workflow в main и dev" "$WORKFLOW_SYNC"
          else
            check "тонкие вызывающие workflow в main и dev" "$WORKFLOW_SYNC"
          fi
          check "провенанс коммитов" "$PROVENANCE"
          check "процессный гейт" "$PROCESS_GATE"
          check "пины сторонних Actions" "$ACTION_PINS"
          # skipped — шаг не судил (не push в dev), это не отказ
          [ "$REVIEWS_INDEX" = "skipped" ] || check "индекс ревью совпадает с каталогом" "$REVIEWS_INDEX"
          exit $fail

  # #1044: обычная задача и интеграционный push выбирают семейства по диффу.
  # Полная регрессия запрашивается явно кандидатом, ночью или full=true;
  # release proof проверяет этот объём отдельно от зелёного статуса workflow.

  changes:
    name: Классификация изменённых файлов
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Чтение списка прогонов Validate — единственное, что этой job нужно сверх
    # содержимого репозитория (#387).
    permissions:
      contents: read
      actions: read
      issues: read
    outputs:
      frontend: ${{ steps.classify.outputs.frontend }}
      tooling: ${{ steps.classify.outputs.tooling == 'true' || steps.heavy.outputs.heavy == 'true' }}
      geometry_parity: ${{ steps.classify.outputs.geometry_parity == 'true' || steps.heavy.outputs.heavy == 'true' }}
      backend: ${{ steps.classify.outputs.backend == 'true' || steps.heavy.outputs.heavy == 'true' }}
      integration: ${{ steps.classify.outputs.integration == 'true' || steps.registry_policy.outputs.registry_mode == 'candidate' }}
      perf_iso: ${{ steps.classify.outputs.perf_iso == 'true' || inputs.full }} # #473 §5
      perf_interaction: ${{ steps.classify.outputs.perf_interaction == 'true' || inputs.full }}
      mutants: ${{ steps.classify.outputs.mutants }}
      unknown_inputs: ${{ steps.classify.outputs.unknown_inputs }}
      registry_mode: ${{ steps.registry_policy.outputs.registry_mode }}
      registry_fresh: ${{ steps.registry_policy.outputs.registry_fresh }}
      # Тяжёлые job только на кандидате/по кнопке/на PR (#479), см. шаг heavy.
      heavy: ${{ steps.heavy.outputs.heavy }}
      golden: ${{ steps.heavy.outputs.golden }}
      browser_plan: ${{ steps.heavy.outputs.browser_plan }}
      browser_subset: ${{ steps.heavy.outputs.browser_subset }}
      mutants_requested: ${{ steps.heavy.outputs.mutants_requested }} # #510
      base: ${{ steps.base.outputs.base }}
      # `base` — до какого коммита классифицировать файлы ветки (#387),
      # `range_base` — от какого судить диапазон на dev/main (#388, #619).
      range_base: ${{ steps.base.outputs.range_base }}
    steps:
      # `git diff --name-only` содержимого файлов не читает вовсе, поэтому
      # блобы истории этой job не нужны ни на одном шаге (#345). Теги — нужны:
      # они граница проверенного материала для `range_base` (#703), а checkout
      # по умолчанию передаёт `git fetch --no-tags`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, filter: 'blob:none', fetch-tags: true }
      # База диапазона — самый новый предок с УСПЕШНО завершённым Validate
      # (#387). Прежде бралась голова предыдущего пуша (`github.event.before`),
      # то есть допущение «до этого всё проверено». Concurrency отменяет прогон
      # предыдущего пуша штатно, и на #86 (r5) это дало зелёный статус ветки
      # без единого исполненного тяжёлого гейта.
      # Смоки, golden, performance_smoke — на кандидате беты (трейлер
      # `Release:` вне веток задач, #697), по `workflow_dispatch full=true`, на
      # PR (#479). Логика и
      # её тест — scripts/classify-changes.mjs.
      - id: base
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          FALLBACK: ${{ github.event.before }}
        run: |
          git fetch -q origin dev
          # Недоступность API — не отказ гейта: пустой ответ уводит базу в
          # сторону БОЛЬШЕГО объёма проверок, а не меньшего.
          # Один запрос на оба режима: `completed` — надмножество `success`,
          # а нужный предикат применяет скрипт (#387 — успех, #388 — судимость).
          gh api -X GET "repos/$REPO/actions/runs" \
            -f branch="$BRANCH" -f status=completed -F per_page=100 \
            > /tmp/validate-runs.json || echo '{}' > /tmp/validate-runs.json
          if [ "$REF" = "refs/heads/dev" ] || [ "$REF" = "refs/heads/main" ]; then
            # Доказанная база нужна классификации и гейтам диапазона (#388).
            # #703: прогоны обеих интеграционных веток — на `main` приходит
            # SHA, уже судимый на `dev`.
            other=dev; [ "$BRANCH" = "dev" ] && other=main
            gh api -X GET "repos/$REPO/actions/runs" \
              -f branch="$other" -f status=completed -F per_page=100 \
              > /tmp/validate-runs-other.json || echo '{}' > /tmp/validate-runs-other.json
            node scripts/classify-base.mjs --head="$HEAD_SHA" --mode=integration --repo="$REPO" \
              --fallback="$FALLBACK" \
              --runs=/tmp/validate-runs.json --runs=/tmp/validate-runs-other.json
            exit 0
          fi
          merge_base=$(git merge-base origin/dev "$HEAD_SHA" || git rev-parse "$HEAD_SHA~1")
          node scripts/classify-base.mjs --head="$HEAD_SHA" \
            --merge-base="$merge_base" --runs=/tmp/validate-runs.json
      - id: registry_policy
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          REF_NAME: ${{ github.ref_name }}
          FRESH_INPUT: ${{ inputs.fresh }}
          CANDIDATE_INPUT: ${{ inputs.candidate }}
        run: node scripts/ci-registry-cli.mjs --policy
      - id: heavy
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          FULL_INPUT: ${{ inputs.full }}
          MUTANTS_INPUT: ${{ inputs.mutants }}
          REF_NAME: ${{ github.ref_name }}
          GREEN_BASE: ${{ steps.base.outputs.base }}
        # #751: без pipefail упавший classify-changes оставлял heavy пустым —
        # тяжёлые job молча пропускались, а job changes зеленела.
        run: |
          set -o pipefail
          node scripts/classify-changes.mjs --heavy --browser-plan | tee -a "$GITHUB_OUTPUT"
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GREEN_BASE: ${{ steps.base.outputs.base }}
          HEAD_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          FULL: ${{ steps.heavy.outputs.heavy }}
        run: |
          set -o pipefail
          if [ "$FULL" = "true" ]; then
            echo "full regression: all check families"
            node scripts/classify-changes.mjs --all >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Ветка задачи всегда судится целиком от origin/dev, включая ранние
          # изменения до последнего зелёного push. Переписанный event.before
          # после rebase не меняет этот диапазон и не требует всех семейств.
          # Интеграционный push использует успешное покрытие, отдельно от
          # судимого диапазона provenance/process (#1060).
          base="$GREEN_BASE"
          case "$REF" in
            refs/heads/issue/*)
              base=$(git merge-base origin/dev "$HEAD_SHA") || {
                echo "::error::Task range is unproven: fetch origin/dev and retry, or explicitly request full=true."
                exit 1
              }
              ;;
            *) if [ "$EVENT_NAME" = "pull_request" ]; then base="$BASE_SHA"; fi ;;
          esac
          if [ -z "$base" ] && { [ "$REF" = "refs/heads/dev" ] || [ "$REF" = "refs/heads/main" ]; }; then
            echo "No verified green coverage: classify all check families"
            node scripts/classify-changes.mjs --all >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$base" ] || ! git merge-base --is-ancestor "$base" "$HEAD_SHA"; then
            echo "::error::Classification needs a proven ancestor: resolve the Git base and retry, or explicitly request full=true."
            exit 1
          fi
          files=$(git diff --name-only "$base" "$HEAD_SHA") || {
            echo "::error::Cannot read the complete task range; fetch the missing Git objects and retry."
            exit 1
          }
          printf '%s\n' "$files" | head -50
          # Решение — в scripts/classify-changes.mjs по единому manifest входов
          # (#492 §5.2): там оно проверяемо unit-тестом, здесь — только
          # переписывается в выходы (#473 AC8).
          printf '%s\n' "$files" | node scripts/classify-changes.mjs > /tmp/classify.out
          tee -a "$GITHUB_OUTPUT" < /tmp/classify.out
          # Файл, которого нет в manifest ни одной проверки, — не «не влияет»,
          # а «неизвестно»: расширяются затронутые семейства, и это видно в
          # summary. Полные browser/performance-наборы задаёт только heavy.
          unknown=$(sed -n 's/^unknown_inputs=//p' /tmp/classify.out)
          if [ -n "$unknown" ]; then
            {
              echo "### Неизвестные входы (#492)"
              echo "Файлы, которых нет в manifest ни одной проверки — расширены затронутые семейства:"
              for f in $unknown; do echo "- \`$f\`"; done
              echo "Впишите файл в \`CHECKS\` или \`NOT_AN_INPUT\` (scripts/check-inputs.mjs) с причиной."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # #981: one orphan-index fetch, independently verified immutable sources.

  reuse:
    name: "Переиспользование: это дерево уже проверено"
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: read
      actions: read
    outputs:
      frontend: ${{ steps.probe.outputs.frontend }}
      frontend_key: ${{ steps.probe.outputs.frontend_key }}
      frontend_record: ${{ steps.probe.outputs.frontend_record }}
      frontend_source_run: ${{ steps.probe.outputs.frontend_source_run }}
      frontend_source_attempt: ${{ steps.probe.outputs.frontend_source_attempt }}
      frontend_source_sha: ${{ steps.probe.outputs.frontend_source_sha }}
      backend: ${{ steps.probe.outputs.backend }}
      backend_key: ${{ steps.probe.outputs.backend_key }}
      backend_record: ${{ steps.probe.outputs.backend_record }}
      backend_source_run: ${{ steps.probe.outputs.backend_source_run }}
      backend_source_attempt: ${{ steps.probe.outputs.backend_source_attempt }}
      backend_source_sha: ${{ steps.probe.outputs.backend_source_sha }}
      geometry_parity: ${{ steps.probe.outputs.geometry_parity }}
      geometry_parity_key: ${{ steps.probe.outputs.geometry_parity_key }}
      geometry_parity_record: ${{ steps.probe.outputs.geometry_parity_record }}
      geometry_parity_source_run: ${{ steps.probe.outputs.geometry_parity_source_run }}
      geometry_parity_source_attempt: ${{ steps.probe.outputs.geometry_parity_source_attempt }}
      geometry_parity_source_sha: ${{ steps.probe.outputs.geometry_parity_source_sha }}
      smoke: ${{ steps.probe.outputs.smoke }}
      smoke_key: ${{ steps.probe.outputs.smoke_key }}
      smoke_record: ${{ steps.probe.outputs.smoke_record }}
      smoke_source_run: ${{ steps.probe.outputs.smoke_source_run }}
      smoke_source_attempt: ${{ steps.probe.outputs.smoke_source_attempt }}
      smoke_source_sha: ${{ steps.probe.outputs.smoke_source_sha }}
      golden: ${{ steps.probe.outputs.golden }}
      golden_key: ${{ steps.probe.outputs.golden_key }}
      golden_record: ${{ steps.probe.outputs.golden_record }}
      golden_source_run: ${{ steps.probe.outputs.golden_source_run }}
      golden_source_attempt: ${{ steps.probe.outputs.golden_source_attempt }}
      golden_source_sha: ${{ steps.probe.outputs.golden_source_sha }}
      performance_smoke: ${{ steps.probe.outputs.performance_smoke }}
      performance_smoke_key: ${{ steps.probe.outputs.performance_smoke_key }}
      performance_smoke_record: ${{ steps.probe.outputs.performance_smoke_record }}
      performance_smoke_source_run: ${{ steps.probe.outputs.performance_smoke_source_run }}
      performance_smoke_source_attempt: ${{ steps.probe.outputs.performance_smoke_source_attempt }}
      performance_smoke_source_sha: ${{ steps.probe.outputs.performance_smoke_source_sha }}
      python_version: ${{ steps.python.outputs.python-version }}
      plan: ${{ steps.probe.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Input identity uses immutable blob OIDs; only trust code and beta
          # scalar mirrors need bytes. Avoid downloading bundles and baselines.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/workflows/
            /.python-version
            /.nvmrc
            /package.json
            /package-lock.json
            /pyproject.toml
            /custom_components/houseplan/manifest.json
            /custom_components/houseplan/const.py
            /src/houseplan-card.ts
            /src/houseplan-editor-runtime.ts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        id: python
        with: { python-version: "3.14" }
      - name: Verify immutable registry producers
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          CI_PYTHON_VERSION: ${{ steps.python.outputs.python-version }}
          REGISTRY_MODE: ${{ needs.changes.outputs.registry_mode }}
          REGISTRY_FRESH: ${{ needs.changes.outputs.registry_fresh }}
          PERF_ISO: ${{ needs.changes.outputs.perf_iso }}
          PERF_INTERACTION: ${{ needs.changes.outputs.perf_interaction }}
        run: node scripts/ci-registry-cli.mjs

  hacs:
    name: "HACS: валидация репозитория"
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main@2026-09-13
        with:
          category: integration

  hassfest:
    name: "Hassfest: манифест интеграции"
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93 # master@2026-09-13

  # #854: retired no-execution compatibility surface for old job-name/proof readers.
  # mutants_requested is always false (#709). Even a mistaken request cannot
  # apply patches, compile a mutant or write caught evidence. The full nightly
  # registry remains in mutation-gate.yml; this is not a mutation proof.

  changed_mutants:
    name: "Мутанты по диффу (${{ matrix.shard }}/6): затронутые свидетели краснеют"
    needs: changes
    if: needs.changes.outputs.mutants_requested == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Development mutation execution retired
        run: |
          echo "::error::Development mutants are retired (#709/#854); use static --check. This job is not caught evidence."
          exit 1

  frontend:
    name: "Фронтенд: типы, юниты, мутанты, синхрон бандла"
    needs: [changes, reuse]
    if: needs.reuse.outputs.frontend != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI_PYTHON_VERSION: ${{ needs.reuse.outputs.python_version }}
    outputs:
      recipe: ${{ steps.stamp.outputs.recipe }}
      toolchain: ${{ steps.stamp.outputs.toolchain }}
      inventory: ${{ steps.stamp.outputs.inventory }}
    steps:
      # Полная история без блобов (#342): гейт «новый код не добавляет any»
      # diff-aware, ему нужен диапазон, а содержимое старых ревизий — нет.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, filter: 'blob:none' }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # #856: build already contains the identical root tsc --noEmit. The
      # emitted test config and noUnusedLocals remain independent contracts.
      - name: Build
        run: npm run build
      # Часть unit-контрактов проверяет размеры реально поставляемых графов в
      # dist/ (#438, #593, #627). В issue-ветке закоммиченный dist законно
      # отстаёт от исходников (#657), поэтому юниты обязаны читать свежую
      # сборку — тот же порядок закреплён локальным gate:small.
      - name: Pure product units on fresh emitted modules
        run: |
          node scripts/ci-registry-inventory.mjs
          npx tsc -p tsconfig.test.json
          node scripts/fix-test-build.mjs
          node scripts/frontend-units.mjs --group=reusable
      - name: Stamp actual producer and byte inventories
        id: stamp
        run: node scripts/ci-registry-build.mjs --stamp
      - name: Выложить бандл для браузерных job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: producer-card-bundle
          path: dist/
          retention-days: 14
          if-no-files-found: error
      # Несколько браузерных контрактов импортируют чистые функции из
      # скомпилированного тестового дерева. Оно создаётся `npm test`, но не
      # входит в production-бандл и потому едет отдельным артефактом (#336).
      - name: Выложить тестовые модули для смоков
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: producer-test-build
          include-hidden-files: true
          path: test-build/
          retention-days: 14
          if-no-files-found: error

  # #657 (2б): бандл в дереве dev меняет только кандидат беты, поэтому стенд
  # dev.houseplan.tech берёт его не из дерева, а из этого артефакта: после
  # зелёного фронтенда на push в dev собранный `dist/` вместе с остальной
  # интеграцией того же SHA (#835) публикуется в служебную ветку `dev-build`
  # одним коммитом без истории (scripts/dev-build.mjs); стенд забирает из неё
  # фронтенд (demo/stand/update-dev-bundle.sh), своя инсталляция владельца —
  # всю интеграцию (scripts/ha-track-dev.sh). Опубликуется только голова:
  # если dev ушёл вперёд, пушит следующий прогон. Не вход доказательства:
  # стенд — не гейт, и сбой публикации не красит проверку кода.

  bundle:
    name: "Упаковка: свежие артефакты кандидата"
    needs: [changes, reuse, frontend]
    if: always() && needs.changes.result == 'success' && needs.reuse.result == 'success' && (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, filter: 'blob:none' }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22 }
      - name: Remove committed release bundle
        run: |
          node -e "require('node:fs').rmSync('dist', { recursive: true, force: true })"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: needs.reuse.outputs.frontend != 'true'
        with: { name: producer-card-bundle, path: dist }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: needs.reuse.outputs.frontend != 'true'
        with: { name: producer-test-build, path: test-build }
      - name: Restore authenticated producer or assemble exact beta bytes
        env:
          GH_TOKEN: ${{ github.token }}
          FRONTEND_REUSED: ${{ needs.reuse.outputs.frontend }}
          FRONTEND_RECORD: ${{ needs.reuse.outputs.frontend_record }}
          FRONTEND_INVENTORY: ${{ needs.frontend.outputs.inventory }}
          REGISTRY_MODE: ${{ needs.changes.outputs.registry_mode }}
        run: node scripts/ci-registry-build.mjs
      - name: Fresh packaging contract
        run: node scripts/bundle-policy.mjs --verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: card-bundle
          path: dist/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: card-test-build
          include-hidden-files: true
          path: test-build/
          retention-days: 14
          if-no-files-found: error

  product_guards:
    name: "Продукт: свежие проверки диапазона и упаковки"
    needs: [changes, bundle]
    if: always() && needs.changes.result == 'success' && needs.bundle.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, filter: 'blob:none' }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Remove committed release bundle before current artifacts
        run: |
          node -e "require('node:fs').rmSync('dist', { recursive: true, force: true })"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: card-bundle, path: dist }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: card-test-build, path: test-build }
      - name: "Новый код не добавляет any и приватных записей в смоках"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PROVEN_BASE: ${{ needs.changes.outputs.range_base }}
          HEAD_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          git fetch -q origin dev
          zero=$(printf '%040d' 0)
          base=""
          # Пуш прямо в dev/main: диапазон — то, что добавлено с последнего
          # ДОКАЗАННО зелёного предка (#388, #619), а не с головы предыдущего
          # пуша: его прогон штатно отменяется следующим, и добавленные им
          # строки не судил бы никто. Фолбэк — прежний `before`.
          if [ "$EVENT_NAME" != "pull_request" ] \
             && { [ "$REF" = "refs/heads/dev" ] || [ "$REF" = "refs/heads/main" ]; }; then
            base="${PROVEN_BASE:-$BEFORE_SHA}"
          fi
          # Ветка, PR, новая история: точки отсчёта нет, берём merge-base с dev.
          # Там диапазон и так шире, поэтому #388 этих случаев не касается.
          if [ -z "$base" ] || [ "$base" = "$zero" ] \
             || ! git cat-file -e "$base" 2>/dev/null; then
            base=$(git merge-base origin/dev "$HEAD_SHA" || echo "")
          fi
          if [ -z "$base" ]; then
            echo "не нашёл базу диапазона — гейт пропущен, это увидит следующий пуш"
            exit 0
          fi
          status=0
          node scripts/no-new-any.mjs --base "$base" --head "$HEAD_SHA" || status=1
          node scripts/no-new-private-writes.mjs --base "$base" --head "$HEAD_SHA" || status=1
          exit "$status"
      - name: Fresh inventory, filesystem/process and packaging contracts
        run: |
          node scripts/ci-registry-inventory.mjs
          node scripts/ci-profiles.mjs
          node scripts/frontend-units.mjs --group=fresh --suite=product
          node scripts/bundle-budget.mjs
          npm run lint:unused
      - name: Fresh backend manifest and synchronized release mirrors
        run: node scripts/ci-registry-build.mjs --manifest
      - name: One smoke on actual assembled beta bundle
        if: needs.changes.outputs.registry_mode == 'candidate'
        run: |
          npx playwright install chromium
          node scripts/bundle-sync.mjs
          node demo/smoke_modes.mjs

  dev_build:
    name: "Бандл головы dev для стенда"
    needs: [bundle, product_guards]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.bundle.result == 'success' && needs.product_guards.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      # download-artifact распаковывает поверх checkout и не удаляет старые
      # content-hashed чанки закоммиченного release-бандла (#657). Свежий
      # артефакт должен быть единственным содержимым dist, иначе bundle-tree
      # справедливо видит оставшиеся файлы как orphan assets.
      - name: Очистить закоммиченный dist перед артефактом
        run: |
          node -e "require('node:fs').rmSync('dist', { recursive: true, force: true })"
      - name: Забрать собранный бандл
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: card-bundle
          path: dist
      - name: Опубликовать в dev-build
        id: publish
        run: node scripts/dev-build.mjs --sha "$GITHUB_SHA" --dist dist
      # #835: своя инсталляция владельца ставит голову dev по вебхуку Home
      # Assistant (scripts/ha-track-dev.sh, docs/DEVELOPMENT.md «Tracking the
      # head of dev»). Зовём, только если изменилось то, что попадает в HA
      # (`changed` по integrationTree: push только документации не будит), и
      # только при заданном секрете — без него шаг ничего не делает. Адрес
      # вебхука — секрет: ни он, ни ответ, ни текст ошибки curl в лог не идут.
      - name: Разбудить свою инсталляцию HA
        if: steps.publish.outputs.changed == 'true'
        env:
          HP_HA_DEV_WEBHOOK: ${{ secrets.HP_HA_DEV_WEBHOOK }}
        run: |
          if [ -z "$HP_HA_DEV_WEBHOOK" ]; then
            echo "секрет HP_HA_DEV_WEBHOOK не задан — вебхук не вызывается"
            exit 0
          fi
          code=0
          curl --silent --fail --max-time 20 --retry 2 -o /dev/null -X POST \
            -H 'Content-Type: application/json' -d "{\"source\": \"$GITHUB_SHA\"}" \
            "$HP_HA_DEV_WEBHOOK" || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning::вебхук своей инсталляции не ответил (curl exit $code)"
            exit 1
          fi
          echo "вебхук своей инсталляции вызван"

  browser_selected:
    name: "Браузер: выбранные проверки push"
    needs: [changes, bundle]
    if: always() && needs.changes.result == 'success' && needs.bundle.result == 'success' && needs.changes.outputs.browser_subset == 'true'
    runs-on: ubuntu-24.04
    # #1058: 246/256 smokes used 2358 s; 40 min cancelled the remaining task plan.
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    env:
      BROWSER_PLAN: ${{ needs.changes.outputs.browser_plan }}
      TASK_CHECK_FRESH: ${{ needs.changes.outputs.registry_fresh == 'true' || needs.changes.outputs.heavy == 'true' }}
    outputs:
      task_check: ${{ steps.receipt.outputs.claim || steps.task_reuse.outputs.claim }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, filter: 'blob:none' }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22, cache: npm }
      - name: Verify identical selected coverage
        id: task_reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/task-check-reuse-cli.mjs --probe=browser_selected
      - run: npm ci
        if: steps.task_reuse.outputs.reused != 'true'
      - name: Кэш браузеров Playwright
        id: pw
        if: steps.task_reuse.outputs.reused != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install pinned Chromium
        if: steps.task_reuse.outputs.reused != 'true' && steps.pw.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Очистить закоммиченный dist перед артефактом
        if: steps.task_reuse.outputs.reused != 'true'
        run: |
          node -e "require('node:fs').rmSync('dist', { recursive: true, force: true })"
      - name: Забрать собранный бандл
        if: steps.task_reuse.outputs.reused != 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: card-bundle
          path: dist
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: steps.task_reuse.outputs.reused != 'true'
        with:
          name: card-test-build
          path: test-build
      - run: node scripts/bundle-sync.mjs
        if: steps.task_reuse.outputs.reused != 'true'
      - name: Run selected progress checks
        if: steps.task_reuse.outputs.reused != 'true'
        env:
          BROWSER_PLAN: ${{ needs.changes.outputs.browser_plan }}
        run: node scripts/browser-selected.mjs
      - name: Stamp direct selected execution
        id: receipt
        if: steps.task_reuse.outputs.reused != 'true'
        run: node scripts/task-check-reuse-cli.mjs --stamp=browser_selected
      - name: Preserve selected progress report
        if: always() && steps.task_reuse.outputs.reused != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-selected
          path: |
            artifacts/browser-selected
            artifacts/golden
          if-no-files-found: error

  smoke:
    name: Смоки в браузере (шард ${{ matrix.shard }} из 3)
    # Gated on `frontend` so a typecheck failure does not burn browser minutes.
    needs: [changes, bundle, reuse]
    if: always() && needs.changes.result == 'success' && needs.bundle.result == 'success' && needs.reuse.result == 'success' && needs.changes.outputs.heavy == 'true' && needs.reuse.outputs.smoke != 'true'
    env:
      CI_PYTHON_VERSION: ${{ needs.reuse.outputs.python_version }}
    runs-on: ubuntu-24.04
    # Leave room for the complete native-UI shard; each smoke still has its
    # independent 180s timeout and every failed scenario fails the whole shard.
    timeout-minutes: 25
    outputs:
      recipe_1: ${{ steps.registry.outputs.recipe_1 }}
      toolchain_1: ${{ steps.registry.outputs.toolchain_1 }}
      recipe_2: ${{ steps.registry.outputs.recipe_2 }}
      toolchain_2: ${{ steps.registry.outputs.toolchain_2 }}
      recipe_3: ${{ steps.registry.outputs.recipe_3 }}
      toolchain_3: ${{ steps.registry.outputs.toolchain_3 }}
      environment_1: ${{ steps.environment.outputs.environment_1 }}
      environment_2: ${{ steps.environment.outputs.environment_2 }}
      environment_3: ${{ steps.environment.outputs.environment_3 }}
    # Смоки шардируются: последовательный прогон занимал ~7.5 минут и был
    # критическим путём всего Validate. Три шарда режут его примерно вдвое;
    # цена — трижды `npm ci` и сборка, около двух оплаченных минут раннера.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Браузеры кэшируются, а apt не запускается вовсе: на GitHub-раннере
      # системные библиотеки Chromium уже в образе, а --with-deps тратил минуты
      # и подолгу перебирал недоступное azure-зеркало (#175, #206). Если
      # библиотека когда-нибудь исчезнет из образа, Chromium не запустится с
      # внятной ошибкой — тогда флаг вернуть.
      - name: Кэш браузеров Playwright
        id: pw
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install pinned Chromium
        if: steps.pw.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      # Бандл приходит артефактом из job `frontend` (#336): та же сборка, но
      # один раз на прогон. Свежесть проверяет сам продукт — `assertFreshDemoBundle`
      # сверяет вшитый отпечаток с исходниками этого дерева.
      - name: Очистить закоммиченный dist перед артефактом
        run: |
          node -e "require('node:fs').rmSync('dist', { recursive: true, force: true })"
      - name: Забрать собранный бандл
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: card-bundle
          path: dist
      - name: Забрать тестовые модули
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: card-test-build
          path: test-build
      - name: Разложить бандл по копиям
        run: node scripts/bundle-sync.mjs
      # Гард исключений внутри карточки объявлен в demo/serve.mjs с 2026-07-27 и
      # до #404 не срабатывал ни разу: счётчик читался раньше, чем Playwright
      # доставлял pageerror. Такое ловится только запуском, поэтому пробы живут
      # здесь — в единственной job с настоящим браузером. Один шард из трёх:
      # проверка не зависит от разбиения, а платить за неё трижды незачем.
      - name: "Гард исключений умеет падать (#404)"
        if: matrix.shard == 1
        run: node demo/guard/verify-guard.mjs
      - name: Smoke suite (шард ${{ matrix.shard }} из 3)
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: '3'
        run: |
          fail=0
          index=0
          ran=0
          mkdir -p /tmp/smoke-logs
          # Деление по порядковому номеру файла: список отсортирован, поэтому
          # разбиение детерминировано и не зависит от времени прогона.
          for f in demo/smoke_*.mjs; do
            index=$((index + 1))
            if [ $(( (index - 1) % SHARDS + 1 )) -ne "$SHARD" ]; then continue; fi
            ran=$((ran + 1))
            name=$(basename "$f" .mjs)
            if timeout --kill-after=10s 180s node "$f" > "/tmp/smoke-logs/$name.log" 2>&1; then
              echo "ok   $name"
            else
              status=$?
              echo "FAIL $name"
              if [ "$status" -eq 124 ]; then
                echo "diagnostic smoke-timeout: $name exceeded 180s"
              fi
              # Диагностические строки смока печатаются раньше вердикта, и
              # `tail -20` их срезал: на #411 сам смок сообщал, НАСКОЛЬКО
              # разошлись кадры (введено в #302), а в логе прогона осталось
              # только «expected true, got false». Числа теперь достаются
              # адресно — они и есть разница между «чинить» и «гадать».
              grep -aE 'pixel-diffs|^EXC |diagnostic' "/tmp/smoke-logs/$name.log" | tail -5 || true
              tail -20 "/tmp/smoke-logs/$name.log"
              fail=1
            fi
          done
          echo "--- шард ${SHARD}/${SHARDS}: прогнано ${ran} из ${index}"
          # Пустой шард — признак, что деление сломалось, а не что работы нет.
          if [ "$ran" -eq 0 ]; then echo "шард пуст: проверьте деление"; exit 1; fi
          exit $fail
      - name: Stamp actual producer environment
        id: environment
        run: node scripts/ci-job-environment.mjs --output=environment_${{ matrix.shard }}
      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smoke-logs-${{ matrix.shard }}
          path: /tmp/smoke-logs

  # Registry receipt is minted only after all three direct shards and smoke_done succeed.
      - name: Stamp registry producer toolchain
        id: registry
        run: node scripts/ci-registry-cli.mjs --stamp-job=smoke --stamp-output=toolchain_${{ matrix.shard }}

  smoke_done:
    name: "Смоки: все шарды зелёные"
    needs: [changes, smoke, reuse]
    if: always() && needs.changes.result == 'success' && needs.smoke.result == 'success' && needs.reuse.result == 'success' && needs.changes.outputs.heavy == 'true' && needs.reuse.outputs.smoke != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: echo "All three direct smoke shards succeeded; no cache marker"

  golden:
    name: Golden-кадры против принятых эталонов
    # Deterministic visual correctness stays in every prerelease gate: it is
    # inexpensive and catches a different class of regressions than timings.
    needs: [changes, bundle, reuse]
    if: always() && needs.changes.result == 'success' && needs.bundle.result == 'success' && needs.reuse.result == 'success' && needs.changes.outputs.golden == 'true' && needs.reuse.outputs.golden != 'true'
    env:
      CI_PYTHON_VERSION: ${{ needs.reuse.outputs.python_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      pending_visual: ${{ steps.golden.outputs.pending_visual }}
      recipe: ${{ steps.registry.outputs.recipe }}
      toolchain: ${{ steps.registry.outputs.toolchain }}
      environment: ${{ steps.environment.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Браузеры кэшируются, а apt не запускается вовсе: на GitHub-раннере
      # системные библиотеки Chromium уже в образе, а --with-deps тратил минуты
      # и подолгу перебирал недоступное azure-зеркало (#175, #206). Если
      # библиотека когда-нибудь исчезнет из образа, Chromium не запустится с
      # внятной ошибкой — тогда флаг вернуть.
      - name: Кэш браузеров Playwright
        id: pw
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install pinned Chromium
        if: steps.pw.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      # Бандл приходит артефактом из job `frontend` (#336): та же сборка, но
      # один раз на прогон. Свежесть проверяет сам продукт — `assertFreshDemoBundle`
      # сверяет вшитый отпечаток с исходниками этого дерева.
      - name: Очистить закоммиченный dist перед артефактом
        run: |
          node -e "require('node:fs').rmSync('dist', { recursive: true, force: true })"
      - name: Забрать собранный бандл
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: card-bundle
          path: dist
      - name: Разложить бандл по копиям
        run: node scripts/bundle-sync.mjs
      # Полный capture на dev допускает только накопленные visual intents.
      # Кандидат/main проверяются строго; pending_visual не даёт release proof.
      - name: Capture or verify golden matrix
        id: golden
        env:
          REF_NAME: ${{ github.ref_name }}
          CANDIDATE_INPUT: ${{ inputs.candidate }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: node scripts/golden-regression.mjs
      - name: Stamp actual producer environment
        id: environment
        run: node scripts/ci-job-environment.mjs
      - name: Upload golden candidates/diffs
        if: failure() || steps.golden.outputs.has_baselines == 'false' || steps.golden.outputs.pending_visual == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: golden-images
          path: artifacts/golden
      # Красная golden обязана сказать, ЧЕЙ это долг (#386). Без этого письмо
      # «Run failed» называет коммит, который пушнули следующим: 29 августа так
      # был назван документ ревью `0f7b6f5`, а сцену без эталона добавил
      # `dbbe94ae`. Вердикт job не меняется — меняется только формулировка.
      - name: Stamp registry producer toolchain
        id: registry
        run: node scripts/ci-registry-cli.mjs --stamp-job=golden

  performance_smoke:
    name: "Перф-смок: бюджет времени кадра"
    # Candidate-only catastrophic-regression guard for ordinary pushes and
    # prereleases. The expensive same-runner comparison lives in performance.yml.
    needs: [changes, bundle, reuse]
    if: always() && needs.changes.result == 'success' && needs.bundle.result == 'success' && needs.reuse.result == 'success' && needs.changes.outputs.heavy == 'true' && needs.reuse.outputs.performance_smoke != 'true'
    env:
      CI_PYTHON_VERSION: ${{ needs.reuse.outputs.python_version }}
    runs-on: ubuntu-24.04
    # 15 минут не хватало, когда установка браузера шла через apt: замер
    # начинался на исходе окна (#206). Запас на холодный кэш — при попадании
    # job укладывается в те же минуты, что и раньше. Диффозависимые профили
    # (#473) добавляют до двух замеров по 3 образца — окно расширено под них.
    timeout-minutes: 30
    outputs:
      recipe: ${{ steps.registry.outputs.recipe }}
      toolchain: ${{ steps.registry.outputs.toolchain }}
      environment: ${{ steps.environment.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Браузеры кэшируются, а apt не запускается вовсе: на GitHub-раннере
      # системные библиотеки Chromium уже в образе, а --with-deps тратил минуты
      # и подолгу перебирал недоступное azure-зеркало (#175, #206). Если
      # библиотека когда-нибудь исчезнет из образа, Chromium не запустится с
      # внятной ошибкой — тогда флаг вернуть.
      - name: Кэш браузеров Playwright
        id: pw
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install pinned Chromium
        if: steps.pw.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      # Бандл приходит артефактом из job `frontend` (#336): та же сборка, но
      # один раз на прогон. Свежесть проверяет сам продукт — `assertFreshDemoBundle`
      # сверяет вшитый отпечаток с исходниками этого дерева.
      - name: Очистить закоммиченный dist перед артефактом
        run: |
          node -e "require('node:fs').rmSync('dist', { recursive: true, force: true })"
      - name: Забрать собранный бандл
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: card-bundle
          path: dist
      - name: Разложить бандл по копиям
        run: node scripts/bundle-sync.mjs
      - name: Capture the heaviest Glow state
        run: |
          npm run benchmark:glow -- --profile=large-house-glow-overlay-v1 --variants=60 --samples=3 --warmups=1 --output=artifacts/performance-smoke/candidate.json
          npm run benchmark:glow -- --profile=large-space-card-glow-v1 --variants=60 --samples=3 --warmups=1 --output=artifacts/performance-smoke/space-candidate.json
      - name: Enforce absolute smoke ceilings
        run: |
          npm run benchmark:compare -- --absolute-only --budgets=demo/performance/budgets-glow-smoke.json --candidate=artifacts/performance-smoke/candidate.json --output=artifacts/performance-smoke/comparison.json
          npm run benchmark:compare -- --absolute-only --budgets=demo/performance/budgets-space-glow-smoke.json --candidate=artifacts/performance-smoke/space-candidate.json --output=artifacts/performance-smoke/space-comparison.json
      # Диффозависимые профили (#473 §5): изометрия — когда дифф задел
      # `src/iso-*`, взаимодействие — когда живой путь или оркестраторы кадра.
      # Абсолютные потолки — `hardMaxMs` полных профилей: регрессия #160
      # (9 870 мс против 3 500) ловится с одного образца, шум — нет.
      - name: Изометрический профиль по диффу (#473)
        if: needs.changes.outputs.perf_iso == 'true'
        run: |
          npm run benchmark:large-house -- --profile=large-house-isometric-v1 --samples=3 --warmups=1 --output=artifacts/performance-smoke/isometric-candidate.json
          npm run benchmark:compare -- --absolute-only --budgets=demo/performance/budgets-isometric-smoke.json --candidate=artifacts/performance-smoke/isometric-candidate.json --output=artifacts/performance-smoke/isometric-comparison.json
      - name: Профиль взаимодействия по диффу (#473)
        if: needs.changes.outputs.perf_interaction == 'true'
        run: |
          npm run benchmark:large-house -- --profile=large-house-interaction-v1 --samples=3 --warmups=1 --output=artifacts/performance-smoke/interaction-candidate.json
          npm run benchmark:compare -- --absolute-only --budgets=demo/performance/budgets-interaction-smoke.json --candidate=artifacts/performance-smoke/interaction-candidate.json --output=artifacts/performance-smoke/interaction-comparison.json
      # #330 AC7: перф-контракт ограничений стыков — быстрый (без браузера),
      # ловит возврат квадратичных путей в оба зеркала прямо на пуше.
      - name: Бюджеты ограничений стыков (#330)
        run: npm run benchmark:junction-limits
      - name: Быстрый commit точки стены (#461)
        run: npm run benchmark:wall-draw-click -- --output=artifacts/performance-smoke/wall-draw-click.json
      - name: Stamp actual producer environment
        id: environment
        run: node scripts/ci-job-environment.mjs
      - name: Upload performance smoke report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: performance-smoke
          path: artifacts/performance-smoke
      # Маркер пишется последним шагом: он существует только если всё выше
      # прошло. Кэш сохраняется post-шагом, то есть тоже лишь при успехе job.
      - name: Stamp registry producer toolchain
        id: registry
        run: node scripts/ci-registry-cli.mjs --stamp-job=performance_smoke

  geometry_parity:
    name: "Геометрия: TS/Python parity исполнена"
    needs: [changes, reuse]
    if: needs.changes.outputs.geometry_parity == 'true' && needs.reuse.outputs.geometry_parity != 'true'
    env:
      CI_PYTHON_VERSION: ${{ needs.reuse.outputs.python_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      recipe: ${{ steps.registry.outputs.recipe }}
      toolchain: ${{ steps.registry.outputs.toolchain }}
      environment: ${{ steps.environment.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ needs.reuse.outputs.python_version }}
      - run: npm ci
      - name: Компилировать TS-зеркала стыков и идентичности/переноса стен
        run: |
          npx --no-install tsc -p tsconfig.junction-parity.json
          node scripts/fix-test-build.mjs
      - name: Сравнить настоящие TS/Python validators (fail closed)
        run: |
          python tests_backend/junction_parity.py --build-dir=test-build/junction-parity
          python tests_backend/wall_node_parity.py --build-dir=test-build/junction-parity
      - name: Stamp actual producer environment
        id: environment
        run: node scripts/ci-job-environment.mjs
      - name: Stamp registry producer toolchain
        id: registry
        run: node scripts/ci-registry-cli.mjs --stamp-job=geometry_parity

  backend:
    name: "Бэкенд: pytest в Home Assistant"
    needs: [changes, reuse]
    if: needs.changes.outputs.backend == 'true' && needs.reuse.outputs.backend != 'true'
    env:
      CI_PYTHON_VERSION: ${{ needs.reuse.outputs.python_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      recipe: ${{ steps.registry.outputs.recipe }}
      toolchain: ${{ steps.registry.outputs.toolchain }}
      environment: ${{ steps.environment.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Browser fixtures are generated by their real ESM factories and then
      # validated through the Python CONFIG_SCHEMA/LAYOUT_SCHEMA in the same test.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ needs.reuse.outputs.python_version }}
      - run: |
          # Точные версии — в tests_backend/requirements.txt (#392): без них
          # резолвер выбирает набор сам, и «зелёный backend» значит разное
          # в разные дни. #42 ставит из того же файла ruff для шага линта.
          pip install -r tests_backend/requirements.txt
          pip list --format=columns | grep -Ei 'homeassistant|voluptuous|^pytest '
      - name: Линт бэкенда (ruff, узкий набор)
        run: python -m ruff check custom_components/houseplan
      # #42: типизация была измеримой только локально — CI её не исполнял, и
      # регрессия в любом из allowlist-модулей проходила молча. Список модулей
      # берётся ИЗ pyproject.toml, а не дублируется здесь: разошедшийся дубль
      # означал бы зелёный шаг, проверяющий не то. Пустой список — отказ.
      - name: Типы бэкенда (mypy strict по allowlist)
        run: |
          modules=$(python -c "
          import tomllib
          cfg = tomllib.load(open('pyproject.toml', 'rb'))
          for o in cfg['tool']['mypy'].get('overrides', []):
              if o.get('strict'):
                  print(' '.join('-p ' + m for m in o['module']))
          ")
          test -n "$modules" || { echo '::error::strict-allowlist в pyproject.toml пуст — проверять нечего'; exit 1; }
          echo "mypy strict: $modules"
          python -m mypy $modules
      # #42: защита от тихого скипа HA-harness — импорт и порог collect
      - name: HA-harness присутствует
        run: |
          python -c "import homeassistant"
          collected=$(python -m pytest tests_backend/ -q --collect-only 2>/dev/null | grep -c "test_ha_" || true)
          echo "collected HA-harness tests: $collected"
          test "$collected" -ge 50
      - name: Backend unit tests (pure + HA harness, coverage)
        run: >
          python -m pytest tests_backend/ -q
          --cov=custom_components/houseplan --cov-branch
          --cov-report=xml --cov-report=term
      - name: Support relay unit tests
        run: python -m unittest discover -s scripts/support-relay/tests -q
      - name: Stamp actual producer environment
        id: environment
        run: node scripts/ci-job-environment.mjs
      # #42: гейт «не ниже baseline» — пороги 90/95 поднимаются trivial-правкой числа
      - name: Порог покрытия не ниже baseline
        run: |
          baseline=$(head -1 scripts/backend-coverage-baseline.txt)
          actual=$(python -c "import xml.etree.ElementTree as ET; print(round(float(ET.parse('coverage.xml').getroot().get('line-rate'))*100, 1))")
          echo "coverage: $actual% (baseline $baseline%)"
          python -c "import sys; sys.exit(0 if float('$actual') >= float('$baseline') - 0.1 else 1)"
      - name: Артефакт coverage.xml
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: coverage.xml
      # Маркер пишется последним шагом: он существует только если всё выше
      # прошло. Кэш сохраняется post-шагом, то есть тоже лишь при успехе job.
      - name: Stamp registry producer toolchain
        id: registry
        run: node scripts/ci-registry-cli.mjs --stamp-job=backend

  proof:
    name: "Доказательство выполненных проверок"
    if: always()
    needs: [preflight, changes, reuse, hacs, hassfest, changed_mutants, frontend, bundle, product_guards, browser_selected, smoke, smoke_done, golden, performance_smoke, geometry_parity, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: 'blob:none'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22 }
      - name: Зафиксировать tree кандидата
        id: candidate
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      # #573: proof несёт составное evidence — product tree без overlay эталонов,
      # сам overlay (tree, sha256 индекса, run из `Baseline-Reviewed`) и
      # content-ключи реюзных job; ключи сверяются с outputs job `reuse`, а
      # потребитель на checkout кандидата пересчитывает всё заново.
      - name: Полный диапазон события
        id: route
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci-profile-event.mjs --candidate --producer=product
      - name: Собрать единый CI proof
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          CANDIDATE_TREE: ${{ steps.candidate.outputs.tree }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_WORKFLOW: validate-product.yml
          CI_EVENT: ${{ github.event_name }}
          CI_REQUIRED_PROFILES: ${{ steps.route.outputs.profiles }}
          REQUEST_FULL: ${{ inputs.full }}
          REQUEST_MUTANTS: ${{ inputs.mutants }}
          REGISTRY_PLAN: ${{ needs.reuse.outputs.plan }}
          CI_PYTHON_VERSION: ${{ needs.reuse.outputs.python_version }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-proof.mjs --emit=artifacts/ci-proof/proof.json
      - name: Опубликовать proof точной попытки
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-proof/proof.json
          retention-days: 30
          if-no-files-found: error
      - name: CAS publish immutable successful execution addresses
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-registry-cli.mjs --publish-proof=artifacts/ci-proof/proof.json
