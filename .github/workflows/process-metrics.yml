name: Метрики процесса

# Тонкий вызывающий файл (#623). Для этого события GitHub берёт workflow из
# ветки по умолчанию (`main`), поэтому здесь только то, что обязано жить там:
# триггеры, run-name, права и concurrency. Тело — `_process-metrics.yml` по ссылке
# `@dev`: правка конвейера — один коммит в `dev`, зеркало в `main` не нужно.
# Этот файл меняется, только когда меняются сами триггеры или потолок прав;
# тогда он зеркалится в `main`, и preflight `workflow_sync` (validate.yml)
# держит копии равными.

on:
  schedule:
    # Понедельник 05:00 UTC — после ночных прогонов, до рабочего дня.
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: "Окно в днях"
        required: false
        default: "7"
        type: string

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  # Потолок прав тела: объединение job-level прав `_process-metrics.yml`. Вызываемый
  # workflow может права только сузить, поэтому каждая его job по-прежнему
  # получает свой прежний минимум (#556), а шире этого набора не получит никто.
  dev:
    permissions:
      contents: read
      actions: read
      issues: read
    uses: Matysh/houseplan-card/.github/workflows/_process-metrics.yml@dev # #623: тело конвейера из dev
    with:
      days: ${{ inputs.days }}
    secrets: inherit
