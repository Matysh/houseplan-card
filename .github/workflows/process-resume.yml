# Generated by scripts/service-workflows.mjs (#1040); mirrored to main.
# main only delivers; authenticated work runs on dev. Failures are not hidden.
name: "Продолжение ревью после Validate"
run-name: "${{ github.ref == 'refs/heads/dev' && format('dev · {0}', github.workflow) || format('relay · {0}', github.workflow) }}"

on:
  workflow_run:
    workflows: ["Проверка (CI)", "Полные бенчмарки производительности"]
    types: [completed]
  workflow_dispatch:
    inputs:
      delivery:
        description: "Internal immutable origin locator; leave empty for an ordinary dev dispatch"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  event:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.repository.full_name == github.repository && github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: write
      actions: write
    uses: Matysh/houseplan-card/.github/workflows/_service-event.yml@dev # #1040: trusted delivery code from dev
    with:
      workflow: process-resume.yml
      parameters: ${{ toJSON(inputs) }}
    secrets: inherit
  dev:
    needs: event
    if: needs.event.outputs.accepted == 'true'
    permissions:
      contents: write
      actions: write
      issues: write
    uses: Matysh/houseplan-card/.github/workflows/_process-resume.yml@dev # #1040: reviewed execution body from dev
    with:
      source_event: ${{ needs.event.outputs.event }}
      source_event_name: ${{ needs.event.outputs.event_name }}
    secrets: inherit
