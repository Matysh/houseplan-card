name: Сверка очереди ревью
run-name: "reconcile process queue · ${{ github.event_name }}"

# Тонкий вызывающий файл (#623). Для этого события GitHub берёт workflow из
# ветки по умолчанию (`main`), поэтому здесь только то, что обязано жить там:
# триггеры, run-name, права и concurrency. Тело — `_process-reconcile.yml` по ссылке
# `@dev`: правка конвейера — один коммит в `dev`, зеркало в `main` не нужно.
# Этот файл меняется, только когда меняются сами триггеры или потолок прав;
# тогда он зеркалится в `main`, и preflight `workflow_sync` (validate.yml)
# держит копии равными.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: "Повторно будить потерянные запросы и публиковать диагностику"
        required: true
        type: boolean
        default: true

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  # Потолок прав тела: объединение job-level прав `_process-reconcile.yml`. Вызываемый
  # workflow может права только сузить, поэтому каждая его job по-прежнему
  # получает свой прежний минимум (#556), а шире этого набора не получит никто.
  dev:
    permissions:
      actions: read
      contents: read
      issues: read
    uses: Matysh/houseplan-card/.github/workflows/_process-reconcile.yml@dev # #623: тело конвейера из dev
    with:
      apply: ${{ inputs.apply == true }}
    secrets: inherit
