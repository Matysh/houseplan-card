# #856: queued is NOT green. Full Validate owns the nightly verdict; the
# authenticated completion/reconcile calls existing ship/night-red controllers.
name: "Ночной полный прогон dev · тело (#623)"

on:
  workflow_call:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: "Запустить полный Validate; сохранить pending без ожидания runner"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "Сдвиг старта ночи против расписания"
        if: github.event_name == 'schedule'
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          read -r minute hour _ <<< "$SCHEDULE"
          now=${NOW_EPOCH:-$(date -u +%s)}
          planned=$(date -u -d "@$now" +%F)
          planned=$(date -u -d "$planned $hour:$minute" +%s)
          [ "$planned" -le "$now" ] || planned=$((planned - 86400))
          lag=$(( (now - planned) / 60 ))
          echo "- Старт по расписанию \`$SCHEDULE\` (UTC): сдвиг $lag мин" >> "$GITHUB_STEP_SUMMARY"
          if [ "$lag" -gt 60 ]; then
            echo "::warning::ночной прогон стартовал на $lag мин позже расписания ($SCHEDULE UTC) — очередь расписаний GitHub (#658)"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dev
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: "Закрепить SHA и поставить Validate(dev, full=true) в очередь — не PASS"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: node scripts/workflow-pending.mjs --kind=night --repo="$REPO" --out="${{ runner.temp }}/workflow-pending"
      - name: Preserve immutable nightly intent
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workflow-continuation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workflow-pending
          if-no-files-found: error
          retention-days: 1
