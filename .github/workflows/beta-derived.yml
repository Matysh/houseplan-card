# Generated by scripts/service-workflows.mjs (#1040); mirrored to main.
# main only delivers; authenticated work runs on dev. Failures are not hidden.
name: "Бета: производные артефакты на dev"
run-name: "${{ github.ref == 'refs/heads/dev' && format('dev · {0}', github.workflow) || format('relay · {0}', github.workflow) }}"

on:
  workflow_dispatch:
    inputs:
      delivery:
        description: "Internal immutable origin locator; leave empty for an ordinary dev dispatch"
        type: string
        required: false
        default: ""
      tag:
        description: "tag"
        type: string
        required: false
        default: ""
      docs_expect_change:
        description: "docs_expect_change"
        type: string
        required: false
        default: ""
      golden_run:
        description: "golden_run"
        type: string
        required: false
        default: ""
      golden_expect_change:
        description: "golden_expect_change"
        type: string
        required: false
        default: ""
      golden_expect_new:
        description: "golden_expect_new"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  event:
    permissions:
      contents: write
      actions: write
    uses: Matysh/houseplan-card/.github/workflows/_service-event.yml@dev # #1040: trusted delivery code from dev
    with:
      workflow: beta-derived.yml
      parameters: ${{ toJSON(inputs) }}
    secrets: inherit
  dev:
    needs: event
    if: needs.event.outputs.accepted == 'true'
    permissions:
      contents: read
      actions: read
    concurrency:
      group: ${{ 'beta-derived' }}
      cancel-in-progress: false
    uses: Matysh/houseplan-card/.github/workflows/_beta-derived.yml@dev # #1040: reviewed execution body from dev
    with:
      source_event: ${{ needs.event.outputs.event }}
      source_event_name: ${{ needs.event.outputs.event_name }}
      tag: ${{ fromJSON(needs.event.outputs.parameters).tag }}
      docs_expect_change: ${{ fromJSON(needs.event.outputs.parameters).docs_expect_change }}
      golden_run: ${{ fromJSON(needs.event.outputs.parameters).golden_run }}
      golden_expect_change: ${{ fromJSON(needs.event.outputs.parameters).golden_expect_change }}
      golden_expect_new: ${{ fromJSON(needs.event.outputs.parameters).golden_expect_new }}
    secrets: inherit
