# Generated by scripts/service-workflows.mjs (#1040); mirrored to main.
# main only delivers; authenticated work runs on dev. Failures are not hidden.
name: "Мутационный гейт"
run-name: "${{ github.ref == 'refs/heads/dev' && format('dev · {0}', github.workflow) || format('relay · {0}', github.workflow) }}"

on:
  schedule:
    - cron: '43 0 * * *'
  workflow_dispatch:
    inputs:
      delivery:
        description: "Internal immutable origin locator; leave empty for an ordinary dev dispatch"
        type: string
        required: false
        default: ""
      ref:
        description: "Git ref whose mutation guards must be proved"
        type: string
        required: false
        default: "dev"

permissions:
  contents: read

jobs:
  event:
    permissions:
      contents: write
      actions: write
    uses: Matysh/houseplan-card/.github/workflows/_service-event.yml@dev # #1040: trusted delivery code from dev
    with:
      workflow: mutation-gate.yml
      parameters: ${{ toJSON(inputs) }}
    secrets: inherit
  dev:
    needs: event
    if: needs.event.outputs.accepted == 'true'
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: ${{ format('mutation-gate-{0}', needs.event.outputs.event_name) }}
      cancel-in-progress: true
    uses: Matysh/houseplan-card/.github/workflows/_mutation-gate.yml@dev # #1040: reviewed execution body from dev
    with:
      source_event: ${{ needs.event.outputs.event }}
      source_event_name: ${{ needs.event.outputs.event_name }}
      ref: ${{ fromJSON(needs.event.outputs.parameters).ref }}
    secrets: inherit
