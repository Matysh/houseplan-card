name: "Релиз: независимое ревью линии"
run-name: "Release review ${{ inputs.tag }}"

# #638, PROCESS.md §11.5: перед стабильным релизом — одно независимое ревью
# поверхностей, изменённых всей линией бет, «с нуля»: без ТЗ и документов
# раундов, по SCOPE и USER-GUIDE. Инкрементальное ревью судит дифф задачи
# против её ТЗ; четыре дефекта линии 1.77 (#607, #608, #611, #619) не входили
# ни в один AC и нашлись только так.
#
# Решение владельца 2026-09-25: ревью НЕ блокирует выпуск. `release.yml`
# запускает этот workflow параллельно гейтам из job, от которого не зависит ни
# один job выпуска; документ — рекомендация, в работу его берёт владелец.
#
# Только `workflow_dispatch`: GitHub исполняет файл с той ветки, на которой
# запущен прогон (`release.yml` зовёт `--ref dev`), поэтому зеркало в `main`
# не нужно, а правка — один коммит в `dev`.
#
# Три job, как у конвейера (#551, #556): детерминированная подготовка,
# недоверенная модель без единого права на запись, детерминированная
# публикация документа в `dev`.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag, for example v1.78.0"
        required: true
        type: string
      candidate:
        description: "Exact candidate SHA; empty = the commit of the tag"
        required: false
        type: string
        default: ""
      force:
        description: "Review again even when the document already exists in dev"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-review-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: "Ревью релиза: вход линии"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.line.outputs.proceed }}
      candidate: ${{ steps.line.outputs.candidate }}
      base: ${{ steps.line.outputs.base }}
      doc: ${{ steps.line.outputs.doc }}
      issues: ${{ steps.line.outputs.issues }}
      input_manifest: ${{ steps.line.outputs.input_manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: dev
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Кандидат, база и issue линии
        id: line
        env:
          TAG: ${{ inputs.tag }}
          CANDIDATE: ${{ inputs.candidate }}
          FORCE: ${{ inputs.force }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Отказ prepare за `| tee` не должен идти дальше с неполным
          # GITHUB_OUTPUT и proceed=true (#751).
          set -o pipefail
          doc=$(node scripts/release-review.mjs doc --tag="$TAG")
          git fetch -q --tags origin
          if [ -z "$CANDIDATE" ]; then
            CANDIDATE=$(git rev-parse --verify -q "refs/tags/$TAG^{commit}") || {
              echo "::error::тега $TAG нет, а кандидат не передан"; exit 1; }
          fi
          git cat-file -e "$CANDIDATE^{commit}"
          CANDIDATE=$(git rev-parse "$CANDIDATE^{commit}")
          # Повтор на тот же тег не тратит модель: документ уже есть (§11.5).
          if [ "$FORCE" != "true" ] && git cat-file -e "origin/dev:$doc" 2>/dev/null; then
            echo "::notice::$doc уже есть в dev — повторное ревью не запускается (force=true, чтобы переснять)"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          out="$RUNNER_TEMP/release-review-input"
          node scripts/release-review.mjs prepare --tag="$TAG" --candidate="$CANDIDATE" --context=true --repo="${{ github.repository }}" \
            --out="$out" --run-url="$RUN_URL" | tee -a "$GITHUB_OUTPUT"
          echo "candidate=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          (cd "$out" && sha256sum brief.md line-membership.json review-source-context.json > manifest.sha256)
          echo "input_manifest=$(sha256sum "$out/manifest.sha256" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          cat "$out/brief.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Передать вход модели
        if: steps.line.outputs.proceed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-review-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-review-input
          if-no-files-found: error
          retention-days: 3

  model_review:
    name: "Ревью релиза: работа модели"
    needs: prepare
    if: needs.prepare.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.result.outputs.artifact }}
      producer_run_id: ${{ steps.result.outputs.producer_run_id }}
      producer_attempt: ${{ steps.result.outputs.producer_attempt }}
      producer_manifest: ${{ steps.result.outputs.producer_manifest }}
    # Недоверенная стадия. Прав на запись нет никаких: ни в репозиторий, ни в
    # issue. Документ публикует `publish`; находки в issue превращает владелец.
    # Native transport не обменивает OIDC на App-токен (#556).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Получить вход линии
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-review-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-review-input

      - name: Проверить вход и кандидата
        env:
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: |
          (cd "$RUNNER_TEMP/release-review-input" && sha256sum -c manifest.sha256)
          test "$(git rev-parse HEAD)" = "$CANDIDATE"

      - name: Установить зависимости
        run: npm ci

      - name: Кэш браузеров Playwright
        id: pw
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Установить Chromium
        if: steps.pw.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # Тот же обход, что у конвейера (_process.yml, anthropics issue 1817).
      - name: "Получить accepted review policy (#1065)"
        id: policy_tools
        run: |
          tools="$RUNNER_TEMP/review-policy-tools"
          mkdir -p "$tools"
          git archive origin/dev scripts | tar -x -C "$tools"
          echo "sha=$(git rev-parse origin/dev)" >> "$GITHUB_OUTPUT"

      - name: Подготовить проверенный контекст ревью
        env:
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: |
          node "$RUNNER_TEMP/review-policy-tools/scripts/review-context.mjs" --kind=release --sha="$CANDIDATE" \
            --input="$RUNNER_TEMP/release-review-input/review-source-context.json" --output="$RUNNER_TEMP/review-context.json"

      - name: Установить Claude Code детерминированно
        id: claude_bin
        run: |
          ver=$(node "$RUNNER_TEMP/review-policy-tools/scripts/review-execution-policy.mjs" version)
          base=https://downloads.claude.ai/claude-code-releases
          bin="$RUNNER_TEMP/review-cli/claude"
          mkdir -p "$(dirname "$bin")"
          curl -fsSL --retry 3 "$base/$ver/linux-x64/claude" -o "$bin"
          sum=$(curl -fsSL --retry 3 "$base/$ver/manifest.json" | jq -r '.platforms["linux-x64"].checksum')
          echo "$sum  $bin" | sha256sum -c -
          chmod +x "$bin"
          actual=$("$bin" --version)
          test "${actual%% *}" = "$ver"
          echo "$actual"
          echo "path=$bin" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: "Ограничить инструменты ревью (#1065)"
        env:
          REVIEW_KIND: release
          REVIEW_CLAUDE_VERSION: ${{ steps.claude_bin.outputs.version }}
          REVIEW_BASE: ${{ needs.prepare.outputs.base }}
          REVIEW_DOC: ${{ runner.temp }}/release-review.md
        run: |
          node "$RUNNER_TEMP/review-policy-tools/scripts/review-execution-policy.mjs" prepare "$RUNNER_TEMP/review-execution-policy.json"

      - name: Подготовить native review prompt
        env:
          REVIEW_PROMPT: ${{ runner.temp }}/review-prompt.txt
          REVIEW_PROMPT_TEXT: |
            Ты независимый ревьюер релиза House Plan. Язык ответа — русский.

            Разрешённые абсолютные пути (не вычисляй их shell/env-командой):
            REVIEW_DOC: ${{ runner.temp }}/release-review.md
            REVIEW_INPUT: ${{ runner.temp }}/release-review-input
            REVIEW_CONTEXT: ${{ runner.temp }}/review-context.json

            Сначала Read REVIEW_CONTEXT: это проверенный контекст линии,
            без авторских ТЗ, handoff и документов прежних раундов.

            Релиз: ${{ inputs.tag }} · кандидат ${{ needs.prepare.outputs.candidate }}
            (рабочая копия уже на нём) · база линии: ${{ needs.prepare.outputs.base || 'нет' }}.
            Вход линии — файл $REVIEW_INPUT/brief.md (issue линии, доказанные
            трейлерами, и изменённые продуктовые файлы) и
            $REVIEW_INPUT/line-membership.json.

            Правила этого ревью — docs/process/REVIEWER.md, раздел «Независимое
            ревью линии», канон — PROCESS.md §11.5. Прочитай их первыми.

            Главное, что нельзя пропустить:
            - Ты судишь ПОВЕРХНОСТИ, изменённые линией, против ПОЛЬЗОВАТЕЛЯ, а
              не дифф против ТЗ. Не читай ТЗ задач (раздел «## ТЗ» в issue,
              docs/specs/**) и документы раундов (docs/reviews/**): независимость
              и есть смысл шага. Основа суждения — docs/SCOPE.md (персоны и
              работы) и docs/USER-GUIDE.ru.md (что обещано пользователю).
            - Проверяй исполнением, а не чтением: собери бандл
              (`npm run bundle:sync`), открой затронутые поверхности в браузере
              (стенд `demo/`, смоки `demo/smoke_*.mjs`), вводи текст
              посимвольно, закрывай диалоги настоящим Escape и крестиком. Где
              есть диалоги HA — пиннутая фикстура `ha-dialog` (#505,
              demo/helpers/README-ha-dialog.md,
              `node demo/verify_ha_dialog_discard_recovery.mjs`).
            - Для каждой поверхности: обычный сценарий и самый рискованный
              соседний, шесть классов риска (async, данные/права, геометрия,
              визуал, объём/perf, host/input) — PROCESS.md §2.6.
            - Ты ничего не правишь и не публикуешь: ни код, ни issue, ни
              комментарии. Права на запись у тебя нет. Любые изменения рабочей
              копии запрещены; обычные generated outputs build/test допустимы.
              Не изменяй и не восстанавливай предмет ревью ради negative witness.

            Tool policy #1065: Read/Grep/Glob для чтения, Write только во внешний
            REVIEW_DOC. Общего Bash/Edit/Agent и business MCP нет.
            REVIEW_CHECKS: ${{ runner.temp }}/review-execution-policy.json.checks.md
            Для нужного исполняемого oracle прочитай manifest и вызови только
            mcp__houseplan_review__run_check с его check_id; bin/argv/env/cwd не задавай.
            ToolSearch допустим только для discovery этого фиксированного runner.
            executed:false/unavailable не является ни PASS, ни выполненным тестом.
            Denied/missing/mismatch/material drift остаются fatal; не повторяй
            неподдержанный запрос обходной командой. Доступный oracle выполняй
            через runner, а не заменяй чтением. При непригодном evidence дай честную границу.

            Находки: High / Medium / Low, у каждой — поверхность, воспроизведение
            (команда или шаги), что увидит пользователь, какая персона задета.
            Выпуск это ревью не останавливает: документ — рекомендация владельцу.

            Напиши полный документ в файл по пути из переменной REVIEW_DOC
            (абсолютный, вне репозитория). Разделы: что входило в линию,
            поверхности и как каждая проверялась (команда → результат),
            находки, что проверено и корректно, чего не проверял и почему.
            Первой строкой после заголовка — `Итог: High N · Medium N · Low N`.

            Затем верни JSON по схеме — последнее обязательное действие.
        run: node "$RUNNER_TEMP/review-policy-tools/scripts/review-native-runner.mjs" prepare-prompt

      - name: Review
        id: review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REVIEW_CLI_PATH: ${{ steps.claude_bin.outputs.path }}
          REVIEW_POLICY: ${{ runner.temp }}/review-execution-policy.json
          REVIEW_PROMPT: ${{ runner.temp }}/review-prompt.txt
          REVIEW_JSON_SCHEMA: '{"type":"object","properties":{"high":{"type":"integer"},"medium":{"type":"integer"},"low":{"type":"integer"},"summary":{"type":"string"}},"required":["high","medium","low","summary"]}'
          REVIEW_KIND: release
          REVIEW_MAX_TURNS: 200
          REVIEW_EXECUTION_DIR: ${{ runner.temp }}/review-native-execution
          REVIEW_DOC: ${{ runner.temp }}/release-review.md
        run: node "$RUNNER_TEMP/review-policy-tools/scripts/review-native-runner.mjs"

      - name: "Проверить execution boundary (#1065)"
        id: execution_boundary
        env:
          REVIEW_EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          REVIEW_STRUCTURED_OUTPUT: ${{ steps.review.outputs.structured_output }}
          REVIEW_DOC: ${{ runner.temp }}/release-review.md
        run: node "$RUNNER_TEMP/review-policy-tools/scripts/review-execution-policy.mjs" audit "$RUNNER_TEMP/review-execution-policy.json"

      - name: "Собрать безопасную диагностику отказа (#1082)"
        id: failure_diagnostics
        if: always() && (steps.review.outcome == 'failure' || steps.execution_boundary.outcome == 'failure')
        env:
          REVIEW_EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          REVIEW_DIAGNOSTIC_TRACE_FALLBACK: ${{ runner.temp }}/review-native-execution/native-messages.json
          REVIEW_DIAGNOSTIC_POLICY: ${{ runner.temp }}/review-execution-policy.json
          REVIEW_DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/review-failure-diagnostics/certificate.json
          REVIEW_DIAGNOSTIC_KIND: release
          REVIEW_DIAGNOSTIC_STAGE: release
          REVIEW_DIAGNOSTIC_SHA: ${{ needs.prepare.outputs.candidate }}
          REVIEW_DIAGNOSTIC_TOOLS_SHA: ${{ steps.policy_tools.outputs.sha }}
        run: node "$RUNNER_TEMP/review-policy-tools/scripts/review-failure-diagnostics.mjs"

      - name: "Сохранить диагностику отказа, не вердикт (#1082)"
        if: always() && (steps.review.outcome == 'failure' || steps.execution_boundary.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-failure-diagnostics-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.failure_diagnostics.outputs.certificate }}
          if-no-files-found: error
          retention-days: 1

      - name: Запечатать результат модели
        id: result
        env:
          SOURCE: ${{ runner.temp }}/release-review.md
          OUT: ${{ steps.review.outputs.structured_output }}
          REPO: ${{ github.repository }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          BASE: ${{ needs.prepare.outputs.base }}
          DOC: ${{ needs.prepare.outputs.doc }}
          INPUT_MANIFEST: ${{ needs.prepare.outputs.input_manifest }}
        run: |
          test -s "$SOURCE" || { echo "::error::модель не оставила документ ревью"; exit 1; }
          dir="$RUNNER_TEMP/release-review-result"
          mkdir -p "$dir"
          printf '%s' "$OUT" > "$dir/result.json"
          jq -e '(.high|type=="number") and (.medium|type=="number") and (.low|type=="number") and (.summary|type=="string")' \
            "$dir/result.json" >/dev/null
          cp "$SOURCE" "$dir/release-review.md"
          jq -n --arg repo "$REPO" --arg candidate "$CANDIDATE" --arg base "$BASE" --arg document "$DOC" \
            --arg input_manifest "$INPUT_MANIFEST" --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{schema:1,kind:"release",repo:$repo,candidate:$candidate,base:$base,document:$document,input_manifest:$input_manifest,run_id:$run_id,run_attempt:$run_attempt}' > "$dir/producer.json"
          (cd "$dir" && sha256sum release-review.md result.json producer.json > manifest.sha256)
          echo "producer_run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "producer_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "producer_manifest=$(sha256sum "$dir/manifest.sha256" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "artifact=release-review-result-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Передать результат публикации
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.result.outputs.artifact }}
          path: ${{ runner.temp }}/release-review-result
          if-no-files-found: error
          retention-days: 3

  publish:
    name: "Ревью релиза: документ в dev"
    needs: [prepare, model_review]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: dev
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Получить результат модели
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.model_review.outputs.artifact }}
          path: ${{ runner.temp }}/release-review-result

      - name: Проверить исходный producer результата
        env:
          REPO: ${{ github.repository }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          BASE: ${{ needs.prepare.outputs.base }}
          DOC: ${{ needs.prepare.outputs.doc }}
          INPUT_MANIFEST: ${{ needs.prepare.outputs.input_manifest }}
          REVIEW_PRODUCER_RUN_ID: ${{ needs.model_review.outputs.producer_run_id }}
          REVIEW_PRODUCER_ATTEMPT: ${{ needs.model_review.outputs.producer_attempt }}
          REVIEW_PRODUCER_MANIFEST: ${{ needs.model_review.outputs.producer_manifest }}
          REVIEW_PRODUCER_RESULT: ${{ needs.model_review.result }}
        run: node scripts/review-result-gate.mjs --batch=release --dir="$RUNNER_TEMP/release-review-result"

      # Модель пишет только текст документа. Путь, машинный блок, индекс и
      # коммит решает этот шаг; всё остальное в рабочей копии не существует.
      - name: Опубликовать документ
        env:
          TOKEN: ${{ secrets.HP_PROCESS_TOKEN }}
          TAG: ${{ inputs.tag }}
          DOC: ${{ needs.prepare.outputs.doc }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          BASE: ${{ needs.prepare.outputs.base }}
          ISSUES: ${{ needs.prepare.outputs.issues }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          dir="$RUNNER_TEMP/release-review-result"
          (cd "$dir" && sha256sum -c manifest.sha256)
          test "$DOC" = "$(node scripts/release-review.mjs doc --tag="$TAG")"
          counts=$(jq -r '"High \(.high) · Medium \(.medium) · Low \(.low)"' "$dir/result.json")
          # Сообщение коммита — построчно в файл, без heredoc в `run:` (#723).
          msg="$RUNNER_TEMP/release-review-commit.txt"
          push_err="$RUNNER_TEMP/release-review-push.stderr"
          # #766: хост push — сервер раннера (GITHUB_SERVER_URL), не зашитый github.com.
          server="${GITHUB_SERVER_URL:-https://github.com}"
          push_url="${server%%://*}://x-access-token:$TOKEN@${server#*://}/${{ github.repository }}"
          for attempt in 1 2 3; do
            git fetch -q origin dev
            git reset -q --hard origin/dev
            git clean -fdq
            mkdir -p docs/reviews
            {
              cat "$dir/release-review.md"
              printf '\n\n<!-- hp-release-review-anchors -->\n### Материал ревью\n\n```\n'
              printf 'tag %s\ncandidate %s\nbase %s\nissues %s\nrun %s\n' \
                "$TAG" "$CANDIDATE" "${BASE:-—}" "${ISSUES:-—}" "$RUN_URL"
              printf '```\n'
            } > "$DOC"
            node scripts/reviews-index.mjs --dir=docs/reviews --strict
            git add -- "$DOC" docs/reviews/INDEX.md
            git diff --cached --name-only | node scripts/review-doc-guard.mjs
            {
              echo "docs: release review for $TAG"
              echo ""
              echo "Независимое ревью линии перед стабильным релизом (PROCESS.md §11.5)."
              echo "Итог: $counts. Выпуск не блокирует; решение по находкам — за владельцем."
              echo ""
              echo "Issue: #638"
              echo "User-Visible: no"
            } > "$msg"
            git -c user.name="claude[bot]" \
                -c user.email="209825114+claude[bot]@users.noreply.github.com" \
                commit -q -F "$msg"
            git diff --name-only "origin/dev...HEAD" | node scripts/review-doc-guard.mjs
            if git push -q "$push_url" HEAD:dev 2> "$push_err"; then
              echo "### Независимое ревью $TAG" >> "$GITHUB_STEP_SUMMARY"
              echo "Итог: $counts — \`$DOC\` в dev. Выпуск не блокируется." >> "$GITHUB_STEP_SUMMARY"
              echo "::notice::$DOC опубликован: $counts"
              exit 0
            fi
            # #723: сдвигом dev считается только устаревший lease — отказ
            # разбирает код слияния (merge-candidate.mjs --push-refusal, #705).
            # Отказ GitHub (право на workflow, правило ветки, хук) повтор не
            # лечит: шаг останавливается, причина и ответ git без токена — в
            # журнале и в сводке шага.
            kind=$(node scripts/merge-candidate.mjs --push-refusal="$push_err" --ref=dev \
              --stage=release-review --summary="$GITHUB_STEP_SUMMARY") || kind=unknown
            if [ "$kind" != "stale" ]; then
              echo "::error::push $DOC в dev отклонён ($kind) — это не сдвиг dev, повтор не поможет; причина и ответ git — выше и в сводке шага"
              exit 1
            fi
            echo "::warning::dev ушёл вперёд — попытка $attempt из 3, документ собирается заново"
            sleep $((attempt * 10))
          done
          echo "::error::документ ревью не опубликован в dev за три попытки"
          exit 1
