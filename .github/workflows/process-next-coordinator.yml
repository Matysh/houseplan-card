# Canonical workflow source; deployed as .github/workflows/process-next-coordinator.yml.
name: Очередь завершения задач
run-name: ${{ github.event_name == 'push' && 'Плашка CI — результат проверок продукта в main' || format('Очередь завершения задач · {0}', github.event_name) }}
on:
  push:
    branches: [main]
  issues:
    types: [labeled, unlabeled, closed, reopened]
  workflow_run:
    workflows: [Содержательное ревью]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
  issues: write
  actions: write
jobs:
  public-ci:
    name: Обновить плашку CI по готовому результату
    if: ${{ vars.PROCESS_NEXT_ENABLED == 'true' && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name) }}
    concurrency:
      group: process-next-public-ci
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dev
          fetch-depth: 0
          # Keep ancestry; limit file contents to the coordinator and its imports.
          sparse-checkout: |
            process-next
            scripts
            demo/helpers
          token: ${{ secrets.HP_PROCESS_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Опубликовать метаданные без запуска тестов
        env:
          PROCESS_NEXT_ENABLED: ${{ vars.PROCESS_NEXT_ENABLED }}
          PROCESS_NEXT_CI_ONLY: 'true'
          HP_PROCESS_NEXT_ACTIVATE: '1'
          GH_TOKEN: ${{ secrets.HP_PROCESS_TOKEN }}
        run: node process-next/templates/coordinator-job.mjs
  progress:
    concurrency:
      group: process-next-coordinator
      cancel-in-progress: false
    if: ${{ vars.PROCESS_NEXT_ENABLED == 'true' && github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      dev_build_sha: ${{ steps.progress.outputs.dev_build_sha }}
      dev_build_issue: ${{ steps.progress.outputs.dev_build_issue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dev
          fetch-depth: 0
          # Keep ancestry; limit file contents to the coordinator and its imports.
          sparse-checkout: |
            process-next
            scripts
            demo/helpers
          token: ${{ secrets.HP_PROCESS_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Продвинуть очередь без запуска тестов
        id: progress
        env:
          PROCESS_NEXT_ENABLED: ${{ vars.PROCESS_NEXT_ENABLED }}
          HP_PROCESS_NEXT_ACTIVATE: '1'
          GH_TOKEN: ${{ secrets.HP_PROCESS_TOKEN }}
          HP_HA_DEV_WEBHOOK: ${{ secrets.HP_HA_DEV_WEBHOOK }}
        run: node process-next/templates/coordinator-job.mjs
  dev-build:
    needs: progress
    if: ${{ vars.PROCESS_NEXT_ENABLED == 'true' && needs.progress.outputs.dev_build_sha != '' }}
    concurrency:
      group: process-next-dev-build
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.progress.outputs.dev_build_sha }}
          fetch-depth: 0
          token: ${{ secrets.HP_PROCESS_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Подготовить зависимости без старых hooks
        run: npm ci --ignore-scripts
      - name: Собрать публикуемый dev-build
        run: node process-next/catalog/prepare.mjs build
      - name: Опубликовать dev-build после merge
        env:
          PROCESS_NEXT_ENABLED: ${{ vars.PROCESS_NEXT_ENABLED }}
          HP_PROCESS_NEXT_ACTIVATE: '1'
          GH_TOKEN: ${{ secrets.HP_PROCESS_TOKEN }}
          DEV_BUILD_SHA: ${{ needs.progress.outputs.dev_build_sha }}
          DEV_BUILD_ISSUE: ${{ needs.progress.outputs.dev_build_issue }}
          HP_HA_DEV_WEBHOOK: ${{ secrets.HP_HA_DEV_WEBHOOK }}
        run: node process-next/templates/coordinator-dev-build.mjs
